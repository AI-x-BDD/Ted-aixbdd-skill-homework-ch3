<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>預約場地</title>
    <link rel="stylesheet" href="proto.css" />
  </head>
  <body>
    <script src="proto.js"></script>
    <script src="invite-data.js"></script>
    <script>
      /* UI-01 預約表單邀請同事介面：?mode=create|rebook|edit、?recurring=1、?state=loading|empty|error、?kind=emails|rules|network、?fail=network */
      (function () {
        var h = P.h,
          q = P.q;
        var main = P.shell("bookings.html");
        var mode = q.get("mode") || "create";
        var rebook = mode === "rebook",
          editing = mode === "edit";
        var kind = q.get("kind") || "emails";

        var T = {
          title: editing ? "修改預約" : rebook ? "再預約一次" : "預約場地",
          submit: editing ? "儲存修改" : "送出預約",
          sending: "送出中…",
          hint: "選填。受邀同事需有啟用中的帳號；受邀人數不受預約人數與場地容納人數限制。",
          emptyHint: "沒有邀請任何人也可以送出。",
          rebookNote: "再預約不會帶入上次的受邀者，需要的話請重新填寫。",
          cleared: "週期性預約不支援邀請同事，已填的 Email 已清除。",
          dup: "重複的 Email 只會邀請一次。",
          fmt: "請輸入有效的 Email。",
          probTitle: "預約沒有成立。以下 Email 有問題，請修正或移除後再送出：",
          netFail: "無法送出預約，預約與邀請都沒有建立。請稍後再試一次。",
          listTitle: "無法送出，以下規則未通過：",
          occupied: "該時段已被占用。請改選其他時段，或登記候補。",
          past: "不能預約已過去的時間。請選擇之後的時段。",
          open: "預約須落在開放時段內。請參考行事曆選擇開放的時間。",
        };
        var REBOOK = { venue: "v1", subject: "產品週會", n: 8 };
        document.title = T.title;

        var root = h("div", { tid: "booking-form" });
        main.appendChild(root);
        root.appendChild(P.header(T.title));

        if (P.state === "loading") {
          root.setAttribute("aria-busy", "true");
          root.appendChild(P.skeleton(5, "booking-form-loading"));
          root.appendChild(
            h("div", { class: "skel skel-item", tid: "booking-invitees-loading", "aria-busy": "true", "aria-label": "載入邀請同事欄位" }),
          );
          return;
        }
        if (rebook)
          root.appendChild(
            h("div", {
              class: "alert ok",
              tid: "booking-rebook-notice",
              role: "status",
              text: "已帶入「" + P.venue(REBOOK.venue).name + "」、主題與人數。請選擇新的日期與起訖時間，主題與人數可以修改。",
            }),
          );
        var errBox = h("div", { tid: "booking-form-error", hidden: true, tabindex: "-1" });
        root.appendChild(errBox);

        var form = h("form", { class: "card booking-form", novalidate: true });
        root.appendChild(form);
        var col1 = h("div", { class: "form-col" }, h("h2", { class: "step" }, h("span", { text: "1" }), "場地與時間"));
        var col2 = h("div", { class: "form-col" }, h("h2", { class: "step" }, h("span", { text: "2" }), "預約資料"));
        form.appendChild(col1);
        form.appendChild(col2);

        /* 範例資料：成功與錯誤情境預填，空狀態與再預約的日期、時間為空白 */
        var filled = (P.state === "success" || P.state === "error") && !rebook;
        var pre = filled
          ? { venue: "v1", date: "2026-11-13", start: "10:00", end: "11:00", subject: "跨部門專案啟動會", att: "6" }
          : { venue: "", date: "", start: "", end: "", subject: "", att: "" };
        if (rebook) pre = { venue: REBOOK.venue, date: "", start: "", end: "", subject: REBOOK.subject, att: String(REBOOK.n) };
        if (editing) pre = { venue: "v1", date: "2026-11-17", start: "14:00", end: "15:00", subject: "週會", att: "6" };

        var venueOpts = [["", "請選擇場地"]].concat(
          P.activeVenues().map(function (v) {
            return [v.id, v.name + "（" + v.loc + "）"];
          }),
        );
        var f = {
          venue: rebook
            ? h("input", { tid: "booking-venue", type: "text", readonly: true, "aria-readonly": "true", value: P.venue(REBOOK.venue).name + "（" + P.venue(REBOOK.venue).loc + "）" })
            : P.select("booking-venue", "", venueOpts, pre.venue),
          date: h("input", { tid: "booking-date", type: "date", value: pre.date }),
          start: P.select("booking-start", "", [["", "請選擇"]].concat(P.times(0, 1410)), pre.start),
          end: P.select("booking-end", "", [["", "請選擇"]].concat(P.times(30, 1440)), pre.end),
          subject: h("input", { tid: "booking-subject", type: "text", value: pre.subject, maxlength: "100" }),
          att: h("input", { tid: "booking-attendees", type: "number", min: "1", inputmode: "numeric", value: pre.att }),
        };
        function curVenue() {
          return P.venue(rebook ? REBOOK.venue : f.venue.value);
        }
        var info = h("div", { class: "hint", tid: "booking-venue-info", style: "margin:-6px 0 12px" });
        function updInfo() {
          var v = curVenue();
          info.textContent = v ? "可容納 " + v.cap + " 人；" + (v.approval ? "需要審核，送出後為待審核並先占用時段" : "送出後立即成立") : "";
        }
        col1.appendChild(P.field("場地", f.venue, null, "booking-venue-error"));
        if (rebook)
          col1.appendChild(h("div", { class: "rebook-venue-row" }, h("a", { class: "btn", tid: "booking-rebook-general-link", href: P.link("booking-form.html"), text: "改為一般預約" })));
        col1.appendChild(info);
        updInfo();
        f.venue.addEventListener("change", function () {
          updInfo();
          P.fieldErr(f.venue, "");
        });
        col1.appendChild(P.field("日期", f.date, null, "booking-date-error"));
        var g = h("div", { class: "grid2" });
        g.appendChild(P.field("開始時間", f.start, null, "booking-start-error"));
        g.appendChild(P.field("結束時間", f.end, "時間以台北時間（UTC+8）顯示", "booking-end-error"));
        col1.appendChild(g);
        col2.appendChild(P.field("主題", f.subject, null, "booking-subject-error"));
        col2.appendChild(P.field("人數", f.att, null, "booking-attendees-error"));

        /* 週期性勾選（修改預約沒有此選項） */
        var recChk = null,
          clearedMsg = h("div", { class: "hint", tid: "booking-invitees-cleared", role: "status", hidden: true, text: T.cleared });
        if (!editing && !rebook) {
          recChk = h("input", { type: "checkbox", tid: "booking-recurring-toggle", checked: q.get("recurring") === "1" });
          col2.appendChild(h("div", { class: "field" }, h("label", { class: "checks" }, recChk, "重複預約")));
          col2.appendChild(clearedMsg);
        }

        /* ---------- 邀請同事欄位 ---------- */
        var vals = [""];
        if (filled && q.get("recurring") !== "1") vals = ["yating@example.com", "dahua@example.com"];
        if (P.state === "error" && kind === "emails") vals = ["yating@example.com", "nobody@example.com", "zhiwei@example.com", "chen@example.com"];
        if (P.state === "error" && kind === "rules") vals = ["yating@example.com", "dahua@example.com"];
        var problems = []; // [{email, reason}]
        var wrap = h("div", { class: "field", tid: "booking-invitees", role: "group", "aria-labelledby": "inv-lbl" });
        var rowsEl = h("div", { class: "invitee-rows" });
        var addBtn = h("button", { class: "btn sm", type: "button", tid: "booking-invitee-add", text: "新增一位" });
        var countEl = h("span", { class: "hint", tid: "booking-invitees-count", role: "status", "aria-live": "polite" });
        var dupEl = h("div", { class: "hint", tid: "booking-invitees-duplicate", role: "status", hidden: true, text: T.dup });
        var emptyEl = h("div", { class: "hint", tid: "booking-invitees-empty", text: T.emptyHint });
        var invErr = h("div", { tid: "booking-invitees-error", hidden: true, tabindex: "-1" });
        wrap.appendChild(h("span", { class: "lbl", id: "inv-lbl", text: "邀請同事（選填）" }));
        wrap.appendChild(h("div", { class: "hint", tid: "booking-invitees-hint", text: T.hint }));
        wrap.appendChild(invErr);
        wrap.appendChild(rowsEl);
        wrap.appendChild(h("div", { class: "row" }, addBtn, countEl));
        wrap.appendChild(dupEl);
        wrap.appendChild(emptyEl);
        if (rebook) wrap.appendChild(h("div", { class: "hint", tid: "booking-invitees-rebook-note", text: T.rebookNote }));
        if (!editing) col2.appendChild(wrap);

        var busyNow = false;
        function nonEmpty() {
          return vals.filter(function (v) {
            return v.trim();
          });
        }
        function sync() {
          var n = P.uniqueEmails(nonEmpty()).length;
          countEl.textContent = n ? "將邀請 " + n + " 位同事" : "";
          dupEl.hidden = !P.hasDuplicate(vals);
          emptyEl.hidden = n > 0;
        }
        function draw(focusIdx) {
          rowsEl.innerHTML = "";
          vals.forEach(function (v, i) {
            var inp = h("input", { tid: "booking-invitee-input", type: "email", inputmode: "email", autocomplete: "off", placeholder: "name@example.com", value: v, id: "inv-" + i });
            inp.disabled = busyNow;
            var fld = P.field("同事 Email " + (i + 1), inp, null, "booking-invitee-input-error");
            var rm = h("button", { class: "btn sm", type: "button", tid: "booking-invitee-remove", "aria-label": "移除同事 Email " + (i + 1), text: "移除", disabled: busyNow });
            rm.addEventListener("click", function () {
              if (vals.length === 1) vals = [""];
              else vals.splice(i, 1);
              problems = [];
              invErr.hidden = true;
              draw(Math.max(0, i - 1));
            });
            inp.addEventListener("input", function () {
              vals[i] = inp.value;
              P.fieldErr(inp, "");
              sync();
            });
            inp.addEventListener("paste", function (e) {
              var text = (e.clipboardData || window.clipboardData).getData("text");
              var parts = P.splitEmails(text);
              if (parts.length > 1) {
                e.preventDefault();
                vals.splice.apply(vals, [i, 1].concat(parts));
                draw(i + parts.length - 1);
              }
            });
            inp.addEventListener("blur", function () {
              var parts = P.splitEmails(inp.value);
              if (parts.length > 1) {
                vals.splice.apply(vals, [i, 1].concat(parts));
                draw();
                return;
              }
              vals[i] = inp.value.trim();
              if (vals[i] && !P.isEmailFormat(vals[i])) P.fieldErr(inp, T.fmt);
              sync();
            });
            var line = h("div", { class: "invitee-row", "data-index": i }, fld, rm);
            rowsEl.appendChild(line);
            var pr = problems.filter(function (p) {
              return P.normEmail(p.email) === P.normEmail(v);
            })[0];
            if (pr) P.fieldErr(inp, pr.reason);
            if (focusIdx === i) inp.focus();
          });
          sync();
        }
        addBtn.addEventListener("click", function () {
          vals.push("");
          draw(vals.length - 1);
        });
        function showProblems() {
          invErr.hidden = false;
          invErr.innerHTML = "";
          var ul = h("ul");
          problems.forEach(function (p) {
            ul.appendChild(h("li", { tid: "booking-invitees-problem-item", text: p.email + "：" + p.reason }));
          });
          invErr.appendChild(h("div", { class: "alert danger", role: "alert" }, T.probTitle, ul));
          draw();
          invErr.focus();
        }
        if (recChk) {
          var applyRec = function () {
            if (recChk.checked) {
              var had = nonEmpty().length > 0;
              vals = [""];
              problems = [];
              invErr.hidden = true;
              wrap.hidden = true;
              clearedMsg.hidden = !had;
              draw();
            } else {
              wrap.hidden = false;
              clearedMsg.hidden = true;
              vals = [""];
              draw();
            }
          };
          recChk.addEventListener("change", applyRec);
          if (recChk.checked) {
            wrap.hidden = true;
          }
        }
        draw();
        if (P.state === "error" && kind === "emails") {
          problems = vals.map(function (v) {
            return { email: v, reason: P.checkEmail(v, []) };
          }).filter(function (p) {
            return p.reason;
          });
          showProblems();
        }

        var submit = h("button", { class: "btn primary", type: "submit", tid: "booking-submit", text: T.submit });
        form.appendChild(h("div", { class: "row form-foot" }, submit, h("a", { class: "btn", tid: "booking-back", href: "bookings.html", text: "返回" })));
        var fields = [f.venue, f.date, f.start, f.end, f.subject, f.att].concat(recChk ? [recChk] : []);

        function busy(b) {
          busyNow = b;
          submit.disabled = b;
          addBtn.disabled = b;
          fields.forEach(function (c) {
            c.disabled = b;
          });
          form.setAttribute("aria-busy", b);
          submit.textContent = b ? T.sending : T.submit;
          draw();
        }
        function frontCheck() {
          var ok = true,
            first = null;
          function bad(c, msg) {
            P.fieldErr(c, msg);
            if (msg) {
              ok = false;
              if (!first) first = c;
            }
          }
          if (!rebook && !editing) bad(f.venue, f.venue.value ? "" : "請選擇場地。");
          bad(f.date, f.date.value ? "" : "請選擇日期。");
          bad(f.start, f.start.value ? "" : "請選擇開始時間。");
          var s = f.start.value ? P.min(f.start.value) : null,
            e = f.end.value ? P.min(f.end.value) : null;
          if (!f.end.value) bad(f.end, "請選擇結束時間。");
          else if (s !== null && e <= s) bad(f.end, "結束時間須晚於開始時間。請重新選擇。");
          else bad(f.end, "");
          bad(f.subject, f.subject.value.trim() ? "" : "請輸入主題。");
          bad(f.att, parseInt(f.att.value, 10) >= 1 ? "" : "請輸入人數，須為 1 以上的整數。");
          rowsEl.querySelectorAll('[data-testid="booking-invitee-input"]').forEach(function (inp) {
            if (inp.value.trim() && !P.isEmailFormat(inp.value)) bad(inp, T.fmt);
          });
          if (first) first.focus();
          return ok;
        }
        function sub(d, s, e) {
          return P.fmtDate(d) + " " + s + "–" + e;
        }
        function resultPanel(text, inviteLine) {
          form.hidden = true;
          errBox.hidden = true;
          var box = h("div", { class: "alert ok", tid: "booking-result", role: "status" }, h("p", { style: "margin:0 0 10px;font-weight:700", text: text }));
          if (inviteLine) box.appendChild(h("p", { tid: "booking-result-invitees", style: "margin:0 0 10px", text: inviteLine }));
          box.appendChild(h("div", { class: "row" }, h("a", { class: "btn primary", tid: "booking-go-my-bookings", href: P.link("bookings.html"), text: "前往我的預約" })));
          root.appendChild(box);
        }
        function ruleErrors() {
          var d = f.date.value,
            s = P.min(f.start.value),
            e = P.min(f.end.value),
            errs = [],
            occ = false;
          if (d < P.NOW.date || (d === P.NOW.date && s < P.min(P.NOW.time))) errs.push(T.past);
          else {
            var o = P.openRange(d);
            if (!o || s < o[0] || e > o[1]) errs.push(T.open);
          }
          var v = curVenue();
          for (var m = s; m < e; m += 30) if (P.slotState(v.id, d, m) === "booked") occ = true;
          if (occ || (P.state === "error" && kind === "rules")) {
            errs.push(T.occupied);
            occ = true;
          }
          return errs;
        }
        form.addEventListener("submit", function (e) {
          e.preventDefault();
          if (busyNow) return;
          errBox.hidden = true;
          errBox.innerHTML = "";
          invErr.hidden = true;
          problems = [];
          vals = vals.map(function (v) {
            return v.trim();
          });
          if (!frontCheck()) return;
          busy(true);
          setTimeout(function () {
            busy(false);
            if (q.get("fail") === "network") {
              errBox.hidden = false;
              errBox.appendChild(h("div", { class: "alert danger", role: "alert", text: T.netFail }));
              errBox.focus();
              return;
            }
            var emails = P.uniqueEmails(nonEmpty());
            if (!editing && !(recChk && recChk.checked)) {
              problems = emails
                .map(function (m) {
                  return { email: m, reason: P.checkEmail(m, []) };
                })
                .filter(function (p) {
                  return p.reason;
                });
              if (problems.length) {
                showProblems(); // 預約不成立、有效的 Email 也不建立邀請、表單內容保留
                return;
              }
            }
            var errs = ruleErrors();
            if (errs.length) {
              errBox.hidden = false;
              var ul = h("ul");
              errs.forEach(function (t) {
                ul.appendChild(h("li", { text: t }));
              });
              errBox.appendChild(h("div", { class: "alert danger", role: "alert" }, T.listTitle, ul));
              errBox.focus();
              return;
            }
            var v = curVenue(),
              n = emails.length,
              s = f.start.value,
              en = f.end.value;
            if (editing) return resultPanel("預約已更新，目前狀態：" + (v.approval ? "待審核" : "已確認") + "。");
            if (v.approval)
              resultPanel("預約申請已送出，等待審核（待審核）。審核期間已為您保留 " + sub(f.date.value, s, en) + "。", n ? "核准後才會發送邀請給 " + n + " 位同事。" : null);
            else resultPanel("預約已成立（已確認）：" + v.name + "，" + sub(f.date.value, s, en) + "。", n ? "已發送邀請給 " + n + " 位同事。" : null);
          }, 600);
        });
        if (P.state === "error" && kind === "rules") {
          errBox.hidden = false;
          errBox.appendChild(
            h("div", { class: "alert danger", role: "alert" }, T.listTitle, h("ul", null, h("li", { text: T.occupied }))),
          );
        }
        if (P.state === "error" && kind === "network") {
          errBox.hidden = false;
          errBox.appendChild(h("div", { class: "alert danger", role: "alert", text: T.netFail }));
        }
      })();
    </script>
  </body>
</html>
