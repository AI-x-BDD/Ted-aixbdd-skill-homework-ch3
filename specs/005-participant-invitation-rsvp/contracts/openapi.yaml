  /api/bookings:
    post:
      tags: [預約]
      summary: 建立單次預約（可同時帶入受邀 Email）
      operationId: createBooking
      description: |
        對應 UI-01「送出預約帶入受邀 Email」「顯示有問題的 Email 與原因」「其他規則被拒絕時保留 Email」，也是 001 UI-03、002 UI-02、003、004 的同一個操作（一般預約與再預約共用，請求不含來源預約識別，後端不從來源預約帶入任何受邀者，FR-006）。所有已登入角色皆以一般員工身分為自己預約。週期性預約（`POST /api/booking-series`）、候補遞補確認與修改預約不讀取 `inviteeEmails`，因此不會產生邀請（FR-001）。

        預約流程（沿用 001、003、004，行為不變，以下只標出與邀請有關的步驟）：
        1. 驗證主題（必填、至多 100 字）與人數（1 以上整數），不合法回 400 並在 fields 列出。
        2. 讀取場地（不存在回 404、已停用回 409 venue_inactive，兩者都不附建議）。
        3. 以純函式一次收集 time_unit、end_not_after_start、duration、past、advance、opening_hours、capacity 的違規。
        4. 在交易內鎖使用者列，檢查預約權限暫停（suspended）與持有上限（quota），兩者都檢查、都列出。受邀者不占用場地時段，也不計入任何人的持有筆數（FR-005）。
        5. 受邀 Email 驗證（本功能新增，FR-002）：`inviteeEmails` 為選填字串陣列；每個 Email 去除前後空白並轉小寫，同一 Email 重複只算一位；須對應系統內啟用中的帳號（`not_found` 查無帳號、`inactive` 帳號已停用），不得是預約者自己（`self`）。一次收集全部有問題的 Email；任何一個有問題時，整個請求回 400，不建立預約、不占用時段、不建立任何邀請，也不通知任何人，Error.inviteeProblems 逐項列出 Email 與原因，Error.fields 另有 `inviteeEmails` 一項。受邀人數不與 `attendees` 或場地容納人數比較，也不查詢受邀者在同一時段的其他預約（FR-005、US1-11、US1-12）。這個驗證與步驟 3 的規則並列：同時有規則未通過時，同一個回應一併列出 violations 與 inviteeProblems。
        6. 時段占用以唯讀方式判定（同 001、003）。violations 或 inviteeProblems 非空時整個交易不寫入任何資料。全部通過才寫入預約與 30 分鐘時段占用；寫入時若因併發而主鍵衝突，回滾後回 409 occupied，不留下任何邀請。
        7. 預約寫入後、仍在同一個交易內為每位去除重複後的受邀者建立邀請：預約狀態為 confirmed 時，邀請為 active、回覆為 none，並為每位受邀者寫入一則「收到邀請」通知（含預約者姓名、場地、日期、起訖與主題，通知帶 invitation_id）；預約狀態為 pending（場地需審核）時，邀請為 pending（待發送），不通知，核准後才發送，駁回或到開始時間仍未審核被自動取消時從未通知（FR-003、FR-004）。邀請與預約同進同退：預約因任何原因失敗，邀請與通知都不會留下（NFR-001、US1-10）。
        8. 回 201 與預約，`inviteeCount` 為去除重複後的受邀人數（沒有受邀者為 0），供畫面顯示「已發送邀請給 N 位同事」或「核准後才會發送邀請給 N 位同事」。

        重複送出：連續快速送出同一份預約時，預約的重複保證沿用 001（只建立一筆，後送者回 409 occupied），因此每位同事只有一份邀請、只收到一則通知（NFR-001、US1-15）。成立時更新預設值的行為同 004，不變。
