      summary: 新增受邀者
      operationId: addBookingInvitees
      description: |
        對應 UI-03「新增受邀者」（`invitee-add-input`、`invitee-add-submit`、`invitee-add-problems`）與「調整被拒絕」。僅預約者本人；全有或全無（FR-024、NFR-004）。請求只含 Email 清單，不接受員工編號。

        前置檢查（依序，任一未通過即整個請求失敗，名單不變）：預約不存在 404；非本人 403；週期性預約場次 409 `booking_recurring`；預約狀態為 cancelled 409 `booking_cancelled`、rejected 409 `booking_rejected`；預約已開始（含 checked_in、completed、no_show 與現在不早於開始時間）409 `booking_started`（FR-023）。

        Email 驗證（FR-002、FR-024，與建立預約共用同一份規則，一次收集全部問題）：每個 Email 去除前後空白並轉小寫，同一 Email 重複填寫只算一位；須對應系統內啟用中的帳號（否則 `not_found`、`inactive`），不得是預約者自己（`self`，不分大小寫），且不得已在該預約未失效（pending 或 active）的邀請中（`already_invited`）。被移除或已失效的人再次新增時視為新的邀請。任何一個 Email 有問題時整個請求回 400，不新增任何一位，在 `inviteeProblems` 逐項列出 Email 與原因。不比較受邀人數與預約人數或容納人數，也不查詢受邀者其他預約的衝突（FR-005）。

        新增成功：預約為 confirmed 時為每位新增者建立 active 邀請、回覆為 none，並寫入「收到邀請」通知（含預約者姓名、場地、日期、起訖與主題，通知帶 invitation_id）；預約為 pending 時建立 pending（待發送）邀請，不通知（FR-004、FR-024）。不改變其他受邀者的邀請與回覆（FR-023）。回 201 與 `InviteesAdded`（新增人數與更新後的名單與統計）。

        重複送出：同一個新增動作並行送出兩次時，唯一性限制（同一預約同一受邀者最多一份 pending 或 active 邀請，由資料庫保證）使第二個請求回 400 `already_invited`，最終只有一份邀請、一則通知，與單次送出的結果一致（NFR-004、US5-14）。
