x-background-jobs:
  description: |
    背景排程（API-05）不是 HTTP 操作，沿用 001 的排程機制：每 30 秒（SCAN_INTERVAL_MS）執行一輪，若上一輪未完成則略過；「現在」取自可注入的時鐘。工作是「查詢到期列加逐筆處理」，交易內以 FOR UPDATE SKIP LOCKED 取最多 100 列，單筆失敗只記錄日誌並繼續；所有判斷只看資料庫狀態與時間，行程重啟後第一輪補做所有到期工作，重複執行不會重複提醒。提醒須在到期時間點後 1 分鐘內產生（NFR-005）。本節只列本功能新增的工作；001 既有的工作不變。
  jobs:
    - name: sendInviteeReminders
      trigger: |
        邀請狀態為 active、回覆為 none（未回覆）或 accepted（已接受）、尚未提醒（reminder_sent_at 為空），所屬預約狀態為 confirmed 且開始時間未到，現在已進入「開始時間減提醒分鐘」之後（提醒分鐘取自規則 reminder_minutes，與 001 提醒預約者共用同一個值，預設 30 分鐘），且邀請最近一次發送時間（notified_at）不晚於「開始時間減提醒分鐘」（邀請發送時距開始已不足提醒時間者不補發，FR-011、US2-14）。
        不提醒的情形全部寫在查詢條件內：回覆為 declined（已婉拒）、邀請為 pending 或 invalid、預約為 pending（含修改後重新審核中）、cancelled 等非 confirmed 狀態（US2-13、US2-15、US2-16）。預約被修改時間後，回覆重置會清除 reminder_sent_at 並更新 notified_at，工作依新時間重新評估。
      result: 為符合條件的受邀者寫入一則「受邀提醒」通知（含預約者姓名、主題、場地與開始時間，帶 invitation_id）並把 reminder_sent_at 設為現在；每份邀請對同一個開始時間只提醒一次。只鎖邀請列，不鎖預約列，避免與「先鎖預約、再鎖邀請」的其他路徑形成相反的鎖定順序。
      x-inner-needs:
        data:
          - name: booking_invitations
            access: read
            fields: [id, booking_id, invitee_user_id, status, response, notified_at, reminder_sent_at]
          - name: booking_invitations
            access: write
            fields: [reminder_sent_at, updated_at]
          - name: bookings
            access: read
            fields: [id, user_id, venue_id, start_at, subject, status]
          - name: venues
            access: read
            fields: [id, name]
          - name: users
            access: read
            fields: [id, name]
          - name: notifications
            access: write
            fields: [user_id, type, message, booking_id, invitation_id, created_at]
          - name: rules
            access: read
            fields: [rule_key, int_value]
        files: []
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sid
      description: 登入後由伺服器設定的 HttpOnly 階段憑證
  responses:
    Unauthorized:
      description: 未登入或登入已逾時
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            notLoggedIn:
              summary: 未登入
              value:
                message: 登入已逾時。請重新登入。
    Forbidden:
      description: 沒有權限、必須先改密碼（訊息「請先設定新密碼」），或請求來源不被允許
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            mustChangePassword:
              summary: 須先改密碼
              value:
                message: 請先設定新密碼。
  parameters:
    bookingId:
      name: bookingId
      in: path
      required: true
      schema:
        type: integer
    invitationId:
      name: invitationId
      in: path
      required: true
      schema:
        type: integer
    notificationId:
      name: notificationId
      in: path
      required: true
      schema:
        type: integer
    limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
  schemas:
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: 繁體中文，說明發生什麼與可以怎麼做，不含內部代碼或技術細節，也不透露占用時段者是誰、其預約主題或人數，不含任何他人的邀請、名單、統計或回覆；訊息中的時間以台北時間（UTC+8）書寫
          examples:
            - 找不到這份邀請。請回到「我的邀請」確認。
            - 預約已開始，回覆沒有成立。
            - 預約已取消，回覆沒有成立。
            - 預約審核中，回覆沒有成立。審核完成後即可回覆。
            - 邀請已失效，回覆沒有成立。
            - 預約已開始，受邀者沒有變動。
            - 預約已取消，受邀者沒有變動。
            - 沒有權限查看這筆預約的受邀者。
            - 預約沒有成立。nobody@example.com：查無帳號。請修正或移除後再送出。
            - 沒有新增任何人。yating@example.com：已在受邀名單中。
            - 人數超過容納人數（可容納 4 人）。請減少人數或改選其他場地。
            - 該時段已被占用。請改選其他時段，或登記候補。
            - 請先設定新密碼。
        fields:
          type: array
          description: 欄位層級的錯誤，供前端標示在欄位下方
          items:
            $ref: "#/components/schemas/FieldError"
        violations:
          type: array
          description: 預約規則未通過的清單，每項含規則代號與說明；同一次請求的全部未通過規則並列於此，包含 occupied
          items:
            $ref: "#/components/schemas/Violation"
        suggestions:
          $ref: "#/components/schemas/Suggestions"
        reason:
          $ref: "#/components/schemas/InviteReason"
        inviteeProblems:
          type: array
          description: 受邀 Email 未通過驗證的清單，一次列出全部有問題的 Email；只出現在建立預約與新增受邀者的 400 回應，此時沒有建立預約、沒有新增任何受邀者
          items:
            $ref: "#/components/schemas/InviteeProblem"
    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          description: 對應請求欄位名稱，例如 subject、attendees、date、inviteeEmails、emails、response
        message:
          type: string
    Violation:
      type: object
      required: [rule, message]
      properties:
        rule:
          type: string
          description: 規則代號；畫面依代號決定文案。400 類：time_unit、end_not_after_start、duration、past、advance、opening_hours、capacity；409 類：occupied、quota、suspended、venue_inactive
          enum:
            - time_unit
            - duration
            - end_not_after_start
            - past
            - advance
            - opening_hours
            - capacity
            - occupied
            - quota
            - suspended
            - venue_inactive
        message:
          type: string
          description: 繁體中文，說明未通過的原因與可以怎麼做；暫停類訊息含以台北時間書寫的解除時間
    InviteReason:
      type: string
      description: 邀請相關 409 的原因代碼，畫面依代碼決定文案；booking_recurring 為週期性預約不支援邀請，booking_cancelled／booking_rejected／booking_started／booking_pending_review 依預約狀態代碼與開始時間判定，invitation_invalid 為邀請已失效（被移出或帳號停用）
      enum:
        - booking_started
        - booking_cancelled
        - booking_rejected
        - booking_pending_review
        - booking_recurring
        - invitation_invalid
    InviteeProblem:
      type: object
      description: 一個有問題的受邀 Email 與原因
      required: [email, reason, message]
      properties:
        email:
          type: string
          description: 去除前後空白並轉小寫後的 Email
        reason:
          type: string
          enum: [not_found, inactive, self, already_invited]
          description: 查無帳號、帳號已停用、不能邀請自己、已在受邀名單中（只在新增受邀者出現）
        message:
          type: string
          description: 繁體中文原因，例如「查無帳號」「帳號已停用」「不能邀請自己」「已在受邀名單中」
    Suggestions:
      type: object
      description: 替代建議（沿用 003）。只在 violations 恰好只有 occupied 一項時出現；建議只是暫時產生的唯讀結果，不被保存，也不保留任何時段
      required: [slots, noSlotsToday, venues]
      properties:
        slots:
          $ref: "#/components/schemas/SlotSuggestions"
        noSlotsToday:
          type: boolean
          description: slots 的 before 與 after 都是 null 時為 true；不跨日尋找
        venues:
          type: array
          description: 同時段其他可用場地，已排好序（不需審核者在前、需審核者在後，各自依場地名稱排序），最多 5 個，沒有時為空陣列
          maxItems: 5
          items:
            $ref: "#/components/schemas/VenueSuggestion"
    SlotSuggestions:
      type: object
      description: 同場地空檔建議；同一台北日期、長度與所選相同
      required: [before, after]
      properties:
        before:
          oneOf:
            - $ref: "#/components/schemas/SlotSuggestion"
            - type: "null"
          description: 開始時間早於所選、離所選開始時間最近的空檔；沒有時為 null
        after:
          oneOf:
            - $ref: "#/components/schemas/SlotSuggestion"
            - type: "null"
          description: 開始時間晚於所選、離所選開始時間最近的空檔；沒有時為 null
    SlotSuggestion:
      type: object
      description: 一個空檔建議；已通過一般單次預約的全部規則檢查（顯示當下）
      required: [startAt, endAt]
      properties:
        startAt:
          type: string
          format: date-time
          pattern: "Z$"
          description: 空檔開始時間（UTC，帶 Z）；前端換算為台北日期與時分後顯示並填回表單
        endAt:
          type: string
          format: date-time
          pattern: "Z$"
          description: 空檔結束時間（UTC，帶 Z）；當天結束的 24:00 對應台北隔日 00:00
    VenueSuggestion:
      type: object
      description: 一個其他可用場地建議；只含場地公開欄位，不含任何占用者資訊
      required: [venueId, name, capacity, requiresApproval]
      properties:
        venueId:
          type: integer
        name:
          type: string
          description: 場地名稱
        capacity:
          type: integer
          description: 場地容納人數，不小於預約人數
        requiresApproval:
          type: boolean
          description: 場地是否需審核；true 時前端標示「需審核」，送出後預約為 pending
    TimeOfDay:
      type: string
      pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
      description: 台北當地時間 HH:mm
    EndTimeOfDay:
      type: string
      pattern: "^(([01][0-9]|2[0-3]):[0-5][0-9]|24:00)$"
      description: 台北當地時間 HH:mm，24:00 表示當日結束
    BookingStatus:
      type: string
      enum:
        [
          pending,
          confirmed,
          checked_in,
          completed,
          rejected,
          cancelled,
          no_show,
        ]
      description: 待審核、已確認、已報到、已完成、已駁回、已取消、未到場
    InvitationStatus:
      type: string
      enum: [pending, active, invalid]
      description: 邀請狀態（不是預約狀態）：待發送（預約審核中尚未通知受邀者）、有效、已失效。待發送只能變為有效或已失效，已失效不再變更並保留最後的回覆（FR-026）。受邀者視角（Invitation）不會出現 pending
    InvitationResponse:
      type: string
      enum: [none, accepted, declined]
      description: 回覆狀態（有效邀請才有意義；失效後保留最後的回覆）：未回覆、已接受、已婉拒
    InvitationReplyInput:
      type: object
      description: 回覆邀請的請求；請求不含員工編號或邀請識別（識別在路徑），身分只來自階段憑證
      required: [response]
      properties:
        response:
          type: string
          enum: [accepted, declined]
          description: accepted 為出席、declined 為不出席；不提供其他選項，也不附備註
    Invitation:
      type: object
      description: 受邀者視角的邀請。只含預約者姓名、場地名稱與地點、日期、起訖、主題與自己的回覆，不含預約人數、場地容納人數、其他受邀者與其回覆
      required:
        [
          id,
          organizerName,
          venueName,
          venueLocation,
          date,
          startTime,
          endTime,
          startAt,
          endAt,
          subject,
          bookingStatus,
          bookingStarted,
          status,
          response,
          canRespond,
          cannotRespondReason,
        ]
      properties:
        id:
          type: integer
          description: 邀請識別
        organizerName:
          type: string
          description: 預約者姓名
        venueName:
          type: string
        venueLocation:
          type: string
        date:
          type: string
          format: date
          description: 台北當地日期
        startTime:
          $ref: "#/components/schemas/TimeOfDay"
        endTime:
          $ref: "#/components/schemas/EndTimeOfDay"
        startAt:
          type: string
          format: date-time
          pattern: "Z$"
          description: 預約開始時間（UTC，帶 Z）；列表依它由早到晚排序
        endAt:
          type: string
          format: date-time
          pattern: "Z$"
          description: 預約結束時間（UTC，帶 Z）
        subject:
          type: string
        bookingStatus:
          $ref: "#/components/schemas/BookingStatus"
        bookingStarted:
          type: boolean
          description: 預約是否已開始（狀態為 checked_in、completed、no_show，或現在不早於開始時間）；由伺服器判定
        status:
          type: string
          enum: [active, invalid]
          description: 邀請狀態；待發送的邀請不會回給受邀者。invalid 時畫面標示「邀請已失效」並保留最後的回覆
        response:
          $ref: "#/components/schemas/InvitationResponse"
        canRespond:
          type: boolean
          description: 目前是否可回覆（邀請 active、預約 confirmed 且尚未開始）；由伺服器依目前時間判定
        cannotRespondReason:
          oneOf:
            - $ref: "#/components/schemas/InviteReason"
            - type: "null"
          description: canRespond 為 false 時的原因，判定順序見 getInvitation；canRespond 為 true 時為 null
    InvitationList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          description: 依預約開始時間由早到晚、再依邀請識別由小到大排序；不含待發送的邀請；不分頁
          items:
            $ref: "#/components/schemas/Invitation"
        total:
          type: integer
          minimum: 0
    InviteeItem:
      type: object
      description: 預約者視角名單中的一位受邀者
      required: [invitationId, name, email, status, response, canRemove]
      properties:
        invitationId:
          type: integer
          description: 邀請識別，移除受邀者時使用
        name:
          type: string
          description: 受邀者姓名
        email:
          type: string
        status:
          $ref: "#/components/schemas/InvitationStatus"
        response:
          $ref: "#/components/schemas/InvitationResponse"
        canRemove:
          type: boolean
          description: 是否提供移除：預約可調整（canAdjust 為 true）且邀請為 pending 或 active 時為 true；已失效（含受邀者帳號停用）的邀請為 false
    InviteeSummary:
      type: object
      description: 出席統計，由伺服器以同一個純函式計算；只計邀請狀態為 active 的邀請，pending 與 invalid 不計入
      required: [invited, accepted, declined, noReply, expected]
      properties:
        invited:
          type: integer
          minimum: 0
          description: 受邀人數（有效邀請的筆數）
        accepted:
          type: integer
          minimum: 0
        declined:
          type: integer
          minimum: 0
        noReply:
          type: integer
          minimum: 0
          description: 未回覆人數
        expected:
          type: integer
          minimum: 1
          description: 預計到場人數 = 1（預約者本人）加 accepted
    BookingInvitees:
      type: object
      description: 預約者視角的受邀名單與出席統計；只有該預約的預約者能取得。attendees 與 venueCapacity 只並列提供，伺服器不比較、不提示、不推薦場地
      required:
        [
          bookingId,
          bookingStatus,
          bookingStarted,
          attendees,
          venueCapacity,
          items,
          summary,
          canAdjust,
          adjustBlockedReason,
        ]
      properties:
        bookingId:
          type: integer
        bookingStatus:
          $ref: "#/components/schemas/BookingStatus"
        bookingStarted:
          type: boolean
          description: 預約是否已開始（定義同 Invitation.bookingStarted）
        attendees:
          type: integer
          description: 預約人數欄位的值，與受邀名單互相獨立，不要求相等
        venueCapacity:
          type: integer
          description: 場地容納人數
        items:
          type: array
          description: 名單；不含被預約者移除的邀請；沒有受邀者時為空陣列（畫面顯示「未邀請任何人」）
          items:
            $ref: "#/components/schemas/InviteeItem"
        summary:
          oneOf:
            - $ref: "#/components/schemas/InviteeSummary"
            - type: "null"
          description: 預約狀態為 pending、cancelled、rejected，或 items 為空時為 null
        canAdjust:
          type: boolean
          description: 是否可新增與移除受邀者（預約 pending 或 confirmed 且尚未開始）
        adjustBlockedReason:
          type: ["string", "null"]
          enum: [booking_started, booking_cancelled, booking_rejected, null]
          description: canAdjust 為 false 時的原因；canAdjust 為 true 時為 null
    AddInviteesInput:
      type: object
      description: 新增受邀者的請求；不接受員工編號。同一 Email（不分大小寫、忽略前後空白）重複只算一位
      required: [emails]
      properties:
        emails:
          type: array
          minItems: 1
          items:
            type: string
    InviteesAdded:
      type: object
      description: 新增受邀者的結果
      required: [addedCount, invitees]
      properties:
        addedCount:
          type: integer
          minimum: 1
          description: 這次新增的人數（去除重複後）
        invitees:
          $ref: "#/components/schemas/BookingInvitees"
    BookingInput:
      type: object
      description: 建立單次預約的請求；date、startTime、endTime 為台北當地日期與時分，不接受帶時區或偏移量的時間戳。請求不含員工編號，預約一律屬於目前登入者；再預約與一般預約格式相同，不含來源預約識別
      required: [venueId, date, startTime, endTime, subject, attendees]
      properties:
        venueId:
          type: integer
        date:
          type: string
          format: date
        startTime:
          $ref: "#/components/schemas/TimeOfDay"
        endTime:
          $ref: "#/components/schemas/EndTimeOfDay"
        subject:
          type: string
          maxLength: 100
        attendees:
          type: integer
          minimum: 1
        inviteeEmails:
          type: array
          description: 選填的受邀 Email 清單；只有建立單次預約讀取，週期性預約、候補與修改預約不讀取。伺服器去除前後空白、轉小寫並去除重複；不限數量，不與 attendees 或場地容納人數比較；省略或空陣列表示不邀請任何人
          items:
            type: string
    Booking:
      type: object
      required:
        [
          id,
          venueId,
          venueName,
          date,
          startTime,
          endTime,
          startAt,
          endAt,
          subject,
          attendees,
          status,
          lateCancel,
        ]
      properties:
        id:
          type: integer
        venueId:
          type: integer
        venueName:
          type: string
        date:
          type: string
          format: date
          description: 台北當地日期
        startTime:
          $ref: "#/components/schemas/TimeOfDay"
        endTime:
          $ref: "#/components/schemas/EndTimeOfDay"
        startAt:
          type: string
          format: date-time
          pattern: "Z$"
          description: 開始時間（UTC，帶 Z）
        endAt:
          type: string
          format: date-time
          pattern: "Z$"
          description: 結束時間（UTC，帶 Z）
        subject:
          type: string
        attendees:
          type: integer
        status:
          $ref: "#/components/schemas/BookingStatus"
        lateCancel:
          type: boolean
        inviteeCount:
          type: integer
          minimum: 0
          description: 本次建立預約時送出的受邀人數（去除重複後，沒有受邀者為 0）；預約為 confirmed 時表示已發送邀請的人數，為 pending 時表示核准後才會發送的人數。只有建立單次預約（createBooking）的回應帶此欄位，其他操作省略
    Notification:
      type: object
      required:
        [id, type, message, createdAt, read, bookingId, waitlistEntryId, invitationId]
      properties:
        id:
          type: integer
        type:
          type: string
          enum:
            [
              booking_created,
              review_result,
              waitlist_offer,
              booking_cancelled,
              review_pending,
              booking_changed,
              suspension,
              waitlist_expired,
              reminder,
              invitation_received,
              invitation_changed,
              invitation_cancelled,
              invitation_removed,
              invitation_reminder,
            ]
          description: 前九種沿用 001；後五種為本功能新增：收到邀請、邀請變更（時間變更含新日期時間與新場地並說明回覆已重置，只換場地含新場地並說明回覆維持不變）、邀請取消（有取消原因時附上）、移出邀請、受邀提醒（含預約者姓名、主題、場地與開始時間）
        message:
          type: string
          description: 事件發生當下組成的繁體中文內容，時間為台北時間
        createdAt:
          type: string
          format: date-time
          pattern: "Z$"
        read:
          type: boolean
        bookingId:
          type: ["integer", "null"]
        waitlistEntryId:
          type: ["integer", "null"]
        invitationId:
          type: ["integer", "null"]
          description: 邀請相關通知所屬的邀請識別，供畫面前往邀請詳情；其餘通知為 null
    NotificationList:
      type: object
      required: [items, total, unreadCount]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        total:
          type: integer
        unreadCount:
          type: integer
    NotificationReadResult:
      type: object
      required: [notification, unreadCount]
      properties:
        notification:
          $ref: "#/components/schemas/Notification"
        unreadCount:
          type: integer
