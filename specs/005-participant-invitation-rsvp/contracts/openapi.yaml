x-invitation-side-effects:
  description: |
    API-04 預約異動同步邀請。下列操作與背景工作的請求與回應格式都不變，只是在各自既有的交易內增加對邀請的處理，因此不重複整個操作；每項只列出該操作因邀請同步而新增的 `x-inner-needs`，操作原有的讀寫維持 001、003 的 x-inner-needs 不變。所有預約狀態變更（預約者取消、管理員取消、場地停用、維護時段、帳號停用、審核駁回、審核逾期自動取消、審核核准）都經過同一個狀態轉換入口，邀請同步掛在該入口，日後新增取消入口也不會漏掉（FR-020）。邀請的狀態變更一律不寫入 booking_events（FR-027）。

    通用規則：
    - 週期性預約場次沒有邀請，下列處理只對有邀請的單次預約生效；沒有邀請時完全不做任何事。
    - 鎖定順序：先鎖預約列、再鎖該預約的邀請列。
    - 邀請服務只讀寫邀請與通知，不改變預約的狀態、時段、持有筆數（FR-027）。
    - 通知只發給受邀者本人，內容在事件發生當下以台北時間組成並固化於 message，不隨日後預約異動更新；通知皆帶 invitation_id，並在交易內寫入，事件發生後 1 分鐘內可在站內看到（NFR-005）。
  operations:
    - operationId: updateBooking
      method: PUT
      path: /api/bookings/{bookingId}
      outerNeeds: UI-03「看到邀請變更通知」「受邀者面板反映重置與保留」、UI-02 回覆被重置後可再次回覆。
      trigger: 預約者修改預約成功（001、003 的修改預約，僅預約者本人）。
      result: |
        依資料庫實際的前後值判斷異動種類：開始或結束時間與修改前不同為 time；時間相同但場地不同為 venue；兩者皆相同（只改主題或人數）為 none，完全不呼叫邀請處理，邀請、回覆與通知都不變（FR-018）。修改失敗（時段被占用等）時整個交易回滾，邀請、回覆與通知都不變（US4-5、NFR-003）。
        修改後預約為 confirmed（FR-017、FR-018）：對該預約 status 為 active 的邀請，time 時把回覆重置為 none、清除最後回覆時間與提醒時間、把通知時間設為現在，並寫入「邀請變更」通知（含預約者姓名、新場地、新日期與起訖，並說明回覆已重置請重新回覆）；venue 時保留回覆，只寫入「邀請變更」通知（含新場地，說明回覆維持不變）；同時改場地與時間依 time 處理並含新場地。status 為 pending（待發送）的邀請不受影響。
        修改後預約為 pending（需重新審核，FR-019）：不重置、不通知，只把 active 邀請的延後套用標記（pending_change）更新為較強的一種（time 強於 venue，已有 time 時不降級）；審核期間受邀者不能回覆（respondInvitation 回 409 booking_pending_review），重置與通知延到預約重新變為 confirmed 時才發生（見 approveBooking）。
        預約被修改多次時，每次日期或起訖時間的變更各自重置一次回覆並通知（邊界情況）。
      x-inner-needs:
        data:
          - name: booking_invitations
            access: read
            fields: [id, booking_id, invitee_user_id, status, response, pending_change]
          - name: booking_invitations
            access: write
            fields: [response, responded_at, reminder_sent_at, notified_at, pending_change, updated_at]
          - name: users
            access: read
            fields: [id, name]
          - name: venues
            access: read
            fields: [id, name]
          - name: notifications
            access: write
            fields: [user_id, type, message, booking_id, invitation_id, created_at]
        files: []
    - operationId: approveBooking
      method: POST
      path: /api/reviews/bookings/{bookingId}/approve
      outerNeeds: UI-01 成功說明「核准後才會發送邀請」的兌現、UI-03 待發送轉為有效、UI-04 收到邀請通知與延後的邀請變更通知。
