        對應 UI-03「移除受邀者」（`invitee-remove`、`invitee-remove-dialog`）與「調整被拒絕」。僅預約者本人；邀請必須屬於路徑中的預約，否則視同不存在回 404（不洩漏他人邀請）。

        前置檢查同新增受邀者：預約不存在 404；非本人 403；週期性場次 409 `booking_recurring`；cancelled 409 `booking_cancelled`；rejected 409 `booking_rejected`；已開始 409 `booking_started`（FR-023）。通過後交易內先鎖預約列、再鎖邀請列：
        - 邀請為 active：改為 invalid（失效原因 `removed`），保留最後的回覆，寫入「已移出邀請」通知（含場地、日期與起訖，通知帶 invitation_id），不附原因（FR-025）。
        - 邀請為 pending：改為 invalid（失效原因 `removed`），不發送任何通知（FR-025、US5-9）。
