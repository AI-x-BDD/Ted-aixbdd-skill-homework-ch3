openapi: 3.1.0
info:
  title: 場地／會議室預約系統 API（005 參與者邀請與出席回覆增量）
  version: 1.4.0
  description: |
    本檔是 001-venue-booking 至 004-favorite-venues-and-defaults 後端 API 在「參與者邀請與出席回覆」功能下的增量契約，涵蓋 plan.md 的 API-01～API-05：
    - API-01 受邀者邀請 API：列出我的邀請、取得邀請詳情、回覆出席與否（新增，`/api/invitations` 底下三個操作）。
    - API-02 預約者受邀名單 API：取得名單與出席統計、新增受邀者、移除受邀者（新增，`/api/bookings/{bookingId}/invitations` 底下三個操作）。
    - API-03 預約建立邀請 API：建立單次預約時帶入受邀 Email（`createBooking` 增量，完整重寫）。
    - API-04 預約異動同步邀請：修改、取消、駁回、審核逾期、場地與帳號停用時的邀請重置、保留、延後套用與失效，以及各類通知。這些副作用發生在 001～003 既有操作與背景工作內，請求與回應的格式都不變，因此不重複整個操作，而是集中寫在頂層 `x-invitation-side-effects`，每項附該操作新增的 `x-inner-needs`。
    - API-05 受邀者開始前提醒排程：背景工作，寫在頂層 `x-background-jobs`。
    另有通知列表與標記已讀的回應多出邀請相關類型與 `invitationId`（`listNotifications`、`markNotificationRead`，完整重寫）。其餘操作（登入、取得目前使用者、取得單筆預約、我的預約列表、週期性預約、候補等）行為不變，沿用 001～004 的契約，本檔不重複。

    共通約定（與 001～004 相同）：
    - 認證：登入後由伺服器設定 HttpOnly cookie `sid`。除登入外所有操作都需登入，未登入回 401。帳號被標示為須先改密碼（mustChangePassword）時一律 403，訊息為「請先設定新密碼」。非 GET 請求須為 application/json，且帶有 Origin 標頭時必須屬於允許的來源，否則 403。
    - 角色與授權（NFR-006）：所有帳號皆具備 employee。回覆邀請與讀取自己的邀請對所有已登入且啟用中的帳號開放（授權動作 `invitation:respond`，實際擁有權由服務比對受邀者）；預約者的名單、新增與移除限預約者本人（授權動作 `invitation:manage`，管理員不例外，管理員不能讀取或調整他人預約的受邀名單，也不能代為回覆）。預約權限被暫停的帳號仍可回覆邀請，也仍可查看與調整自己預約的受邀者。授權以伺服器為準，略過畫面直接送出也會被拒絕。
    - 身分唯一來源：本檔所有操作的路徑、查詢與請求本文都不接受員工編號或受邀者帳號識別；身分只來自階段憑證所對應的使用者。受邀者視角的回應（`Invitation`）與預約者視角的回應（`BookingInvitees`）由兩組各自獨立的資料結構組成，受邀者視角不含預約人數、容納人數、其他受邀者與其回覆。
    - 時間格式（C-SH-02）：回應與資料結構中所有時間點屬性（名稱以 At 結尾，例如 startAt、endAt、createdAt）一律為 `type: string`、`format: date-time` 的帶 Z 的 ISO 8601 UTC 字串，例如 `2026-11-20T02:00:00.000Z`；使用者輸入的預約時間一律為台北當地（UTC+8）的 `date`（YYYY-MM-DD）加 `startTime`、`endTime`（HH:mm），不接受帶時區或偏移量的時間戳，由伺服器轉為 UTC。本功能自己的請求（回覆、新增受邀者）沒有時間輸入。x-inner-needs 中表示時間點的資料欄位一律以 `_at` 結尾且為 UTC（例如 start_at、notified_at、reminder_sent_at、responded_at、created_at、updated_at）。通知與錯誤訊息含時間時一律以台北時間（UTC+8）書寫，日期格式「{YYYY}年{M}月{D}日（週{X}）」、24 小時制 `HH:mm`、起訖寫成 `HH:mm–HH:mm`，結束時間正好是台北當天結束時寫成 `24:00`。
    - 狀態代碼（C-SH-01）：預約狀態（BookingStatus）為 pending、confirmed、checked_in、completed、rejected、cancelled、no_show，為英文 snake_case 代碼，與資料庫 CHECK 清單及前端 shared/src/copy.js 逐字相同，中文名稱只作顯示文案。邀請狀態（InvitationStatus：pending 待發送、active 有效、invalid 已失效）與回覆狀態（InvitationResponse：none 未回覆、accepted 已接受、declined 已婉拒）是另外兩組代碼，不屬於預約狀態，不得與 BookingStatus 混用；本檔所有依預約狀態決定的行為一律以 BookingStatus 代碼指稱。
    - 「現在」一律由伺服器判定：預約是否已開始、邀請是否仍可回覆、受邀者是否仍可調整，都由伺服器依目前時間計算並隨資料回傳（`bookingStarted`、`canRespond`、`canAdjust`），前端不以裝置時鐘判斷。「預約已開始」指預約狀態為 checked_in、completed、no_show，或預約狀態為 pending、confirmed 但現在已不早於開始時間。
    - 錯誤：失敗回應一律為 Error 結構，訊息為繁體中文，說明發生什麼事與可以怎麼做，不含內部代碼或技術細節。狀態碼：400 格式或規則驗證未通過、401 未登入、403 無權限、404 資源不存在、409 與目前狀態衝突。邀請相關的 409 在 Error.reason 附一個 InviteReason 代碼，供畫面決定文案；受邀 Email 未通過驗證時回 400 並在 Error.inviteeProblems 逐項列出 Email 與原因。
    - 邀請隱私：非本人的邀請與不存在的邀請一律回同一種 404（訊息「找不到這份邀請」），不洩漏邀請是否存在；他人的名單、統計與回覆永不出現在任何回應中。
    - 邀請不影響預約（FR-027）：邀請與回覆不改變預約的狀態、時段、持有筆數或 001 任何規則的判定，也不寫入預約狀態的操作紀錄（booking_events）；回覆本身不對預約者產生任何通知。
    - 預約與邀請同進同退（NFR-001、NFR-003、NFR-004）：建立、修改、取消、駁回與新增、移除受邀者，與其邀請的建立、重置、保留、失效及通知都在同一個資料庫交易內，全有或全無。鎖定順序一律先鎖預約列、再鎖該預約的邀請列。
    - 本檔未列出僅供測試使用的 /__test/clock、/__test/tick。
  x-common-inner-needs:
    description: 所有需登入的操作在授權前都會做階段驗證，這些讀寫不在各操作的 x-inner-needs 重複列出，資料庫端需涵蓋。
    data:
      - name: sessions
        access: read
        fields: [token_hash, user_id, expires_at]
      - name: sessions
        access: write
        fields: [expires_at]
      - name: users
        access: read
        fields: [id, is_active, must_change_password, suspended_until_at]
      - name: user_roles
        access: read
        fields: [user_id, role]
    files: []
servers:
  - url: http://127.0.0.1:3000
    description: 本機後端（正式環境同一行程也提供前端靜態檔）
tags:
  - name: 我的邀請
  - name: 受邀名單
  - name: 預約
  - name: 通知
security:
  - cookieAuth: []
paths:
  /api/invitations:
    get:
      tags: [我的邀請]
      summary: 列出我的邀請
      operationId: listMyInvitations
      description: |
        對應 UI-02「瀏覽我的邀請」（`invitation-list`、`invitation-item`，含回覆標籤、邀請已失效、預約審核中、預約已開始標籤與空狀態「目前沒有邀請」）。所有已登入角色，只回傳發給本人的邀請（`invitee_user_id` 等於登入者），不接受任何帳號參數（NFR-006）。

        範圍與排序（FR-007）：只含邀請狀態為 active 與 invalid 的邀請；pending（待發送）的邀請不出現。邀請失效後（預約取消或駁回、被預約者移除、本人帳號停用後重新啟用）仍列出並保留最後的回覆。依預約開始時間由早到晚、再依邀請識別由小到大排序；不分頁，沒有邀請時 `items` 為空陣列、`total` 為 0。

        每項只含受邀者看得到的欄位（FR-008）：預約者姓名、場地名稱與地點、日期、起訖、主題、預約狀態代碼、預約是否已開始、邀請狀態、回覆狀態、目前是否可回覆與不可回覆的原因；不含預約人數、場地容納人數、其他受邀者與其回覆。可回覆與否、已開始與否都由伺服器依目前時間判定。
      x-inner-needs:
        data:
          - name: booking_invitations
            access: read
            fields: [id, booking_id, invitee_user_id, status, response, invalid_reason]
          - name: bookings
            access: read
            fields: [id, user_id, venue_id, start_at, end_at, subject, status]
          - name: venues
            access: read
            fields: [id, name, location]
          - name: users
            access: read
            fields: [id, name]
        files: []
      responses:
        "200":
          description: 我的邀請（可為空）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/invitations/{invitationId}:
    get:
      tags: [我的邀請]
      summary: 取得邀請詳情
      operationId: getInvitation
      description: |
        對應 UI-02「開啟邀請詳情」（`invitation-detail-*`），也是 UI-04 邀請通知連結（`notification-open-invitation`）的目的地。所有已登入角色，只能讀取發給本人的邀請。

        詳情從資料庫即時讀取預約資料，因此預約改期或換場地後立即顯示最新場地與時間，不依賴通知文案（舊通知保留事件發生當下的文案快照）。回應與列表項目是同一個資料結構 `Invitation`：預約者姓名、場地名稱與地點、日期、起訖、主題、邀請狀態、回覆狀態、預約狀態代碼、預約是否已開始、目前是否可回覆與不可回覆的原因；不含預約人數、其他受邀者與其回覆（FR-008）。邀請失效時仍可讀取，保留最後的回覆（`canRespond` 為 false、`cannotRespondReason` 為 `invitation_invalid` 或 `booking_cancelled`／`booking_rejected`）。

        不可回覆原因的判定順序（列表與詳情共用，與回覆被拒絕的 `reason` 一致）：預約狀態為 cancelled → `booking_cancelled`；rejected → `booking_rejected`；邀請狀態為 invalid → `invitation_invalid`；預約狀態為 pending → `booking_pending_review`；預約已開始（含 checked_in、completed、no_show 與現在不早於開始時間）→ `booking_started`；以上皆非且邀請為 active 時可回覆，原因為 null。

        非本人的邀請、不存在的邀請與仍是 pending（待發送）的邀請一律回同一種 404，不洩漏他人資料（NFR-006、SC-007）。
      x-inner-needs:
        data:
          - name: booking_invitations
            access: read
            fields: [id, booking_id, invitee_user_id, status, response, invalid_reason]
          - name: bookings
            access: read
            fields: [id, user_id, venue_id, start_at, end_at, subject, status]
          - name: venues
            access: read
            fields: [id, name, location]
          - name: users
            access: read
            fields: [id, name]
        files: []
      parameters:
        - $ref: "#/components/parameters/invitationId"
      responses:
        "200":
          description: 邀請詳情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: 邀請不存在、不是本人的邀請，或仍是待發送；三種情形回應完全相同
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                notFound:
                  summary: 找不到這份邀請
                  value:
                    message: 找不到這份邀請。請回到「我的邀請」確認。
  /api/invitations/{invitationId}/response:
    put:
      tags: [我的邀請]
      summary: 回覆出席或不出席
      operationId: respondInvitation
      description: |
        對應 UI-02「回覆出席」（`invitation-reply-accept`）、「回覆不出席」（`invitation-reply-decline`）、「回覆被拒絕」「回覆失敗」。語意為「把我的回覆設為某值」而不是切換，因此使用 PUT：重複送出同一個值結果相同（回 200，不產生第二份回覆結果），預約開始前可隨時改變心意，以最後一次回覆為準（FR-009、NFR-002）。所有已登入角色，只能回覆發給本人的邀請；回覆本身不對預約者產生任何通知，不寫入預約的操作紀錄（FR-009、FR-027）。

        流程（交易內先鎖預約列、再鎖邀請列，與取消路徑相同順序，回覆與取消同時發生時只有先處理者生效，失效後仍被接受的回覆為 0 筆）：
        1. `response` 不是 `accepted` 或 `declined` 回 400（fields 列出 response）。
        2. 邀請不存在、不是本人的、或仍是 pending 回 404（與詳情相同，不洩漏）。
        3. 依詳情相同的判定順序檢查是否可回覆；不可回覆時回 409 並在 `reason` 附原因代碼，回覆狀態維持不變（FR-010）：`booking_cancelled`、`booking_rejected`、`invitation_invalid`、`booking_pending_review`、`booking_started`。
        4. 通過後更新回覆與最後回覆時間，回 200 與更新後的 `Invitation`（含目前的回覆狀態）。
        同一份邀請同時收到不同回覆時，鎖的先後決定最後值，最後處理的回覆為準（NFR-002）。
      x-inner-needs:
        data:
          - name: booking_invitations
            access: read
            fields: [id, booking_id, invitee_user_id, status, response, invalid_reason]
          - name: booking_invitations
            access: write
            fields: [response, responded_at, updated_at]
          - name: bookings
            access: read
            fields: [id, user_id, venue_id, start_at, end_at, subject, status]
          - name: venues
            access: read
            fields: [id, name, location]
          - name: users
            access: read
            fields: [id, name]
        files: []
      parameters:
        - $ref: "#/components/parameters/invitationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationReplyInput"
      responses:
        "200":
          description: 回覆已記錄（含重複送出同一個值），回傳更新後的邀請
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
        "400":
          description: response 不是 accepted 或 declined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalidResponse:
                  summary: 回覆值不合法
                  value:
                    message: 回覆內容不正確。請選擇「出席」或「不出席」。
                    fields:
                      - field: response
                        message: 請選擇「出席」或「不出席」。
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: 邀請不存在、不是本人的邀請，或仍是待發送
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                notFound:
                  summary: 找不到這份邀請
                  value:
                    message: 找不到這份邀請。請回到「我的邀請」確認。
        "409":
          description: 目前不能回覆，回覆狀態沒有改變。Error.reason 為 booking_cancelled、booking_rejected、invitation_invalid、booking_pending_review、booking_started 之一
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                started:
                  summary: 預約已開始
                  value:
                    message: 預約已開始，回覆沒有成立。
                    reason: booking_started
                cancelled:
                  summary: 預約已取消
                  value:
                    message: 預約已取消，回覆沒有成立。
                    reason: booking_cancelled
                pendingReview:
                  summary: 預約審核中
                  value:
                    message: 預約審核中，回覆沒有成立。審核完成後即可回覆。
                    reason: booking_pending_review
                invalid:
                  summary: 邀請已失效
                  value:
                    message: 邀請已失效，回覆沒有成立。
                    reason: invitation_invalid
  /api/bookings/{bookingId}/invitations:
    get:
      tags: [受邀名單]
      summary: 取得預約的受邀名單與出席統計
      operationId: listBookingInvitees
      description: |
        對應 UI-03「展開與收合受邀者面板」「查看受邀名單與統計並與人數並列」「重新整理」「看到未邀請任何人」「無法調整的原因」（再次展開面板與按「重新整理」呼叫同一個操作）。僅預約者本人（授權動作 `invitation:manage`）；管理員與其他員工回 403，不回傳任何名單或人數（NFR-006、SC-007）。預約不存在回 404。週期性預約場次回 409（`booking_recurring`），因為邀請只屬於單次預約（FR-023）。

        回應 `BookingInvitees`：
        - `items`：該預約 status 為 pending（待發送）或 active（有效）的邀請，以及 status 為 invalid 且失效原因不是「被預約者移除」的邀請（預約取消或駁回、受邀者帳號停用）；被預約者移除的邀請不列出（FR-014、FR-025）。每項含邀請識別、姓名、Email、邀請狀態、回覆狀態與是否可移除。依邀請識別由小到大排序。
        - `summary`：出席統計，由伺服器以同一個純函式計算（SC-005）。只計邀請狀態為 active 的邀請：`invited` 為其筆數，`accepted`、`declined`、`noReply` 為各回覆狀態的筆數，`expected = 1 + accepted`（預約者本人加已接受人數）；pending 與 invalid 的邀請不計入任何統計（FR-014）。預約狀態為 pending、cancelled、rejected 時為 null（待審核不顯示統計，已取消與已駁回不顯示預計到場人數）；`items` 為空（未邀請任何人）時也為 null（FR-013）。
        - `attendees`（預約人數）與 `venueCapacity`（場地容納人數）只並列回傳，伺服器不做任何比較、提示或場地建議（FR-016）。
        - `canAdjust` 與 `adjustBlockedReason`：預約狀態為 pending 或 confirmed 且現在早於開始時間時可調整（可新增與移除），否則不可調整並附原因：`booking_started`（含 checked_in、completed、no_show）、`booking_cancelled`、`booking_rejected`。
        受邀者回覆後，下次讀取立即反映最新回覆（FR-015），伺服器不快取。
      x-inner-needs:
        data:
          - name: bookings
            access: read
            fields: [id, user_id, venue_id, start_at, attendees, status, series_id]
          - name: venues
