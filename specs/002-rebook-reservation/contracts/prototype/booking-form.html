<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>再預約一次</title>
    <link rel="stylesheet" href="proto.css" />
  </head>
  <body>
    <script src="proto.js"></script>
    <script src="waitlist-dialog.js"></script>
    <script>
      (function () {
        var h = P.h,
          q = P.q;
        var main = P.shell("bookings.html");
        var suspended = q.get("suspended") === "1";
        var SUSPEND_UNTIL_TEXT = "2026年11月12日（週四）10:30";
        var fromId = q.get("from");

        /* 假資料：來源預約（只取場地、主題、人數）。其他編號一律視為「不存在或非本人」 */
        var SOURCES = {
          b1: { venue: "v1", subject: "產品週會", n: 6 },
          b2: { venue: "v2", subject: "客戶簡報", n: 12 },
          b3: { venue: "v4", subject: "一對一", n: 2 },
          b4: { venue: "v4", subject: "一對一", n: 2 },
          b5: { venue: "v3", subject: "新人訓練", n: 25 },
          b6: { venue: "v1", subject: "專案同步", n: 5 },
          b7: { venue: "v2", subject: "部門會議", n: 15 },
          b8: { venue: "v1", subject: "設計討論", n: 4 },
          b9: { venue: "v5", subject: "活動籌備", n: 20 },
          q1: { venue: "v4", subject: "產品週會", n: 6 }
        };

        document.title = "再預約一次";
        var root = h("div", { tid: "booking-form" });
        main.appendChild(root);
        root.appendChild(P.header("再預約一次"));
        if (suspended)
          root.appendChild(
            h("div", {
              class: "alert warn",
              tid: "suspension-banner",
              role: "status",
              text: "您的預約權限已暫停至 " + SUSPEND_UNTIL_TEXT + "。暫停期間無法新增預約、登記候補與確認遞補。"
            })
          );

        function generalLink() {
          return h("a", {
            class: "btn",
            tid: "booking-rebook-general-link",
            href: P.link("booking-form.html"),
            text: "改為一般預約"
          });
        }

        /* 載入狀態 */
        if (P.state === "loading") {
          root.setAttribute("aria-busy", "true");
          root.appendChild(P.skeleton(5, "booking-form-loading"));
          return;
        }
        /* 錯誤狀態：網路失敗或來源預約無法讀取 */
        var src = SOURCES[fromId];
        if (P.state === "error" && q.get("kind") === "network") {
          root.appendChild(
            P.stateBox("error", "booking-form-error", "無法載入這筆預約的內容", "無法載入這筆預約的內容。請稍後按「重新載入」再試一次。", [
              h("button", { class: "btn", type: "button", tid: "booking-form-reload", text: "重新載入", onclick: function () { location.href = P.link("booking-form.html", "from=" + encodeURIComponent(fromId || "b1")); } }),
              " ",
              h("a", { class: "btn", tid: "booking-back", href: P.link("bookings.html"), text: "返回" })
            ])
          );
          return;
        }
        if (P.state === "error" || !src) {
          root.appendChild(
            P.stateBox("error", "booking-rebook-source-error", "找不到這筆預約", "找不到這筆預約，無法帶入內容。你可以改為一般預約，自行選擇場地與時間。", [
              generalLink(),
              " ",
              h("a", { class: "btn", tid: "booking-back", href: P.link("bookings.html"), text: "返回" })
            ])
          );
          return;
        }

        var v = P.venue(src.venue);
        var notice = h("div", {
          class: "alert ok",
          tid: "booking-rebook-notice",
          role: "status",
          text: "已帶入「" + v.name + "」、主題與人數。請選擇新的日期與起訖時間，主題與人數可以修改。"
        });
        root.appendChild(notice);

        /* 來源場地已停用：表單停用並說明原因 */
        var venueOff = !v.active;
        if (venueOff)
          root.appendChild(
            h("div", { class: "alert danger", tid: "booking-rebook-source-error", role: "alert" }, "此場地已停用，無法再預約。請改為一般預約，選擇其他場地。", " ", generalLink())
          );

        var errBox = h("div", { tid: "booking-form-error", hidden: true, tabindex: "-1" });
        if (!venueOff) root.appendChild(errBox);
        var form = h("form", { class: "card booking-form", novalidate: true });
        root.appendChild(form);
        var col1 = h("div", { class: "form-col" }, h("h2", { class: "step" }, h("span", { text: "1" }), "場地與時間"));
        var col2 = h("div", { class: "form-col" }, h("h2", { class: "step" }, h("span", { text: "2" }), "預約資料"));
        form.appendChild(col1);
        form.appendChild(col2);

        var TIMES_S = [["", "請選擇"]].concat(P.times(0, 1410));
        var TIMES_E = [["", "請選擇"]].concat(P.times(30, 1440));
        var f = {
          venue: h("input", {
            tid: "booking-venue",
            type: "text",
            value: v.name + "（" + v.loc + "）",
            readonly: true,
            "aria-readonly": "true",
            "aria-describedby": "venue-fixed"
          }),
          date: h("input", { tid: "booking-date", type: "date", value: q.get("date") || "" }),
          start: P.select("booking-start", "", TIMES_S, q.get("start") || ""),
          end: P.select("booking-end", "", TIMES_E, q.get("end") || ""),
          subject: h("input", { tid: "booking-subject", type: "text", value: src.subject, maxlength: "100" }),
          att: h("input", { tid: "booking-attendees", type: "number", min: "1", inputmode: "numeric", value: src.n })
        };
        col1.appendChild(P.field("場地", f.venue));
        col1.appendChild(
          h("div", { class: "hint", id: "venue-fixed", style: "margin:-6px 0 4px", text: "再預約的場地固定。要換場地請改為一般預約。" })
        );
        col1.appendChild(h("div", { style: "margin:0 0 8px" }, generalLink()));
        col1.appendChild(
          h("div", {
            class: "hint",
            tid: "booking-venue-info",
            style: "margin:0 0 12px",
            text: "可容納 " + v.cap + " 人；" + (v.approval ? "需要審核，送出後為待審核並先占用時段" : "送出後立即成立")
          })
        );
        col1.appendChild(P.field("日期", f.date, null, "booking-date-error"));
        var g = h("div", { class: "grid2" });
        g.appendChild(P.field("開始時間", f.start, null, "booking-start-error"));
        g.appendChild(P.field("結束時間", f.end, "時間以台北時間（UTC+8）顯示", "booking-end-error"));
        col1.appendChild(g);
        col2.appendChild(P.field("主題", f.subject, null, "booking-subject-error"));
        col2.appendChild(P.field("人數", f.att, null, "booking-attendees-error"));

        var submit = h("button", { class: "btn primary", type: "submit", tid: "booking-submit", text: "送出預約", disabled: venueOff });
        form.appendChild(
          h("div", { class: "row form-foot" }, submit, h("a", { class: "btn", tid: "booking-back", href: P.link("bookings.html"), text: "返回" }))
        );
        if (venueOff) [f.date, f.start, f.end, f.subject, f.att].forEach(function (c) { c.disabled = true; });

        function busy(b) {
          submit.disabled = b;
          [f.date, f.start, f.end, f.subject, f.att].forEach(function (c) { c.disabled = b; });
          form.setAttribute("aria-busy", b);
          submit.textContent = b ? "送出中…" : "送出預約";
        }
        function showErrors(list, wl) {
          errBox.hidden = false;
          errBox.innerHTML = "";
          var ul = h("ul");
          list.forEach(function (t) { ul.appendChild(h("li", { text: t })); });
          var box = h("div", { class: "alert danger", role: "alert" }, "無法送出，以下規則未通過：", ul);
          if (wl)
            box.appendChild(
              h("div", null, h("button", {
                class: "btn sm",
                type: "button",
                tid: "booking-waitlist-link",
                text: "登記候補",
                onclick: function (e) {
                  P.waitlistDialog({ venue: src.venue, date: f.date.value, start: f.start.value, end: f.end.value, subject: f.subject.value, att: f.att.value }, e.target);
                }
              }))
            );
          errBox.appendChild(box);
          errBox.focus();
        }

        /* 前端檢查：必填、結束晚於開始、長度上限、人數上限 */
        function frontCheck(noFocus) {
          var ok = true,
            first = null;
          function bad(c, msg) {
            P.fieldErr(c, msg);
            if (msg) { ok = false; if (!first) first = c; }
          }
          bad(f.date, f.date.value ? "" : "請選擇日期。");
          bad(f.start, f.start.value ? "" : "請選擇開始時間。");
          var s = f.start.value ? P.min(f.start.value) : null,
            e = f.end.value ? P.min(f.end.value) : null;
          if (!f.end.value) bad(f.end, "請選擇結束時間。");
          else if (s !== null && e <= s) bad(f.end, "結束時間須晚於開始時間。請重新選擇。");
          else if (s !== null && e - s > 240) bad(f.end, "單次最長 4 小時。請縮短預約時間。");
          else bad(f.end, "");
          bad(f.subject, f.subject.value.trim() ? "" : "請輸入主題。");
          var n = parseInt(f.att.value, 10);
          if (!(n >= 1)) bad(f.att, "請輸入人數，須為 1 以上的整數。");
          else if (n > v.cap) bad(f.att, "人數超過容納人數（可容納 " + v.cap + " 人）。請減少人數後再送出。");
          else bad(f.att, "");
          if (first && !noFocus) first.focus();
          return ok;
        }
        /* 假的「內層」判定：與現在有關的規則在此判斷，不在前端判斷 */
        function serverCheck() {
          var errs = [],
            d = f.date.value,
            s = P.min(f.start.value),
            e = P.min(f.end.value),
            wl = false;
          if (suspended)
            errs.push("您的預約權限已暫停，將於 " + SUSPEND_UNTIL_TEXT + " 解除。解除前仍可報到、取消與修改既有預約。");
          if (q.get("limit") === "1")
            errs.push("已達持有上限（最多 5 筆）。請先取消或等待既有預約結束後再預約。");
          if (d < P.NOW.date || (d === P.NOW.date && s < P.min(P.NOW.time)))
            errs.push("不能預約已過去的時間。請選擇之後的時段。");
          else if (d > P.addDays(P.NOW.date, 30))
            errs.push("最遠可預約到 2026年12月7日（週一）。請選擇更早的日期。");
          else {
            var o = P.openRange(d);
            if (!o || s < o[0] || e > o[1]) errs.push("預約須落在開放時段內。請參考行事曆選擇開放的時間。");
            else
              for (var m = s; m < e; m += 30)
                if (P.slotState(src.venue, d, m) !== "free") {
                  errs.push("該時段已被占用。請改選其他時段，或登記候補。");
                  wl = true;
                  break;
                }
          }
          return { errs: errs, wl: wl };
        }

        var sending = false, attempted = false;
        function doSubmit() {
          if (sending) return; // 連按兩次只送出一次
          attempted = true;
          errBox.hidden = true;
          if (!frontCheck()) return;
          sending = true;
          busy(true);
          setTimeout(function () {
            var r = serverCheck();
            sending = false;
            busy(false);
            if (r.errs.length) {
              showErrors(r.errs, r.wl); // 表單內容全部保留
              return;
            }
            var status = v.approval ? "pending" : "confirmed";
            try {
              var list = JSON.parse(sessionStorage.getItem("rebook-proto:created") || "[]");
              list.push({
                id: "n" + Date.now(),
                venue: v.name,
                date: f.date.value,
                s: f.start.value,
                e: f.end.value,
                subject: f.subject.value.trim(),
                n: parseInt(f.att.value, 10),
                status: status,
                venueActive: true
              });
              sessionStorage.setItem("rebook-proto:created", JSON.stringify(list));
            } catch (x) {}
            location.href = P.link("bookings.html", "rebooked=" + status);
          }, 600);
        }
        form.addEventListener("submit", function (ev) {
          ev.preventDefault();
          doSubmit();
        });
        [f.date, f.start, f.end, f.subject, f.att].forEach(function (c) {
          c.addEventListener("blur", function () {
            if (attempted) frontCheck(true);
          });
        });

        /* 空狀態與狀態入口：?state=empty 直接呈現未選時間就送出的必填提示；?autosubmit=1 帶著預設值自動送出 */
        if (P.state === "empty" || q.get("autosubmit") === "1") setTimeout(doSubmit, 0);
      })();
    </script>
  </body>
</html>
