openapi: 3.1.0
info:
  title: 場地／會議室預約系統 API
  version: 1.0.0
  description: |
    單一公司內部使用的場地預約後端。帳號與登入、場地與維護時段、場地搜尋與行事曆、單次與週期性預約、審核、候補、站內通知、規則管理與報表。

    共通約定：
    - 認證：登入後由伺服器設定 HttpOnly cookie `sid`（階段憑證）。除登入外所有操作都需登入，未登入回 401。帳號被標示為須先改密碼（mustChangePassword）時，除「查詢自己」「變更密碼」「登出」以外一律 403，訊息為「請先設定新密碼」。非 GET 請求須為 application/json，且帶有 Origin 標頭時必須屬於允許的來源，否則 403。
    - 角色：employee（所有帳號皆具備）、reviewer（場地審核者）、admin（系統管理員）。各操作的 description 寫明可呼叫的角色；授權以伺服器為準，略過畫面直接送出也會被拒絕。
    - 時間：所有時間以台北時間（UTC+8）為準。請求的日期為 `YYYY-MM-DD`、時間為 `HH:mm`（台北當地），伺服器轉成 UTC 儲存；回應的預約、時段、維護時段同時提供台北當地欄位（date、startTime、endTime）與 ISO 8601 UTC 欄位（startAt、endAt）。結束時間可為 `24:00`（表示當日結束）；開始時間最晚 `23:30`。星期以數字表示，0 為週日、6 為週六。週檢視一週為週一至週日。
    - 時間格式（C-SH-02）：回應與資料結構中所有時間點屬性（名稱以 At 結尾，例如 startAt、endAt、createdAt、suspendedUntil）一律為 `type: string`、`format: date-time` 的帶 Z 的 ISO 8601 UTC 字串，例如 `2026-11-20T02:00:00.000Z`；使用者輸入的預約時間（建立、修改、候補、維護時段、報表區間、行事曆與衝突預覽查詢）一律為台北當地的 `date`（YYYY-MM-DD）加 `startTime`、`endTime`（HH:mm），不接受帶時區或偏移量的時間戳，由伺服器轉為 UTC。x-inner-needs 中表示時間點的資料欄位一律以 `_at` 結尾且為 UTC（例如 start_at、suspended_until_at、slot_start_at）；`open_minute`、`close_minute` 為台北當地一天內的分鐘數，週期性批次的 `start_time`、`end_time` 為台北當地 HH:mm，皆不是時間點。
    - 狀態代碼（C-SH-01）：預約狀態（BookingStatus）為 pending、confirmed、checked_in、completed、rejected、cancelled、no_show；週期性預約批次狀態（SeriesStatus）為 pending、confirmed、rejected、cancelled，與預約共用同一組英文 snake_case 代碼，中文名稱只作顯示文案。批次核准後為 confirmed（沒有 approved），整批所有場次皆取消後為 cancelled。
    - 「現在」一律由伺服器判定：回應內含「目前台北日期」、各預約的可取消／可修改／可報到旗標，前端不以裝置時鐘判斷。
    - 規則單位：規則以分鐘、天、筆、批、個月、次儲存；管理畫面的「單次時長上限」「逾時取消門檻」「候補截止門檻」以小時顯示，API 的規則管理操作（/api/rules）以畫面單位（小時）收發並由伺服器換算，GET /api/context 的規則值則一律以儲存單位（分鐘）回傳。
    - 分頁：列表以 limit／offset 分頁，回應含 items 與 total。
    - 錯誤：失敗回應一律為 Error 結構，訊息為繁體中文，說明發生什麼事與可以怎麼做，不含內部代碼或技術細節。狀態碼：400 格式或規則驗證未通過、401 未登入、403 無權限、404 資源不存在、409 與目前狀態衝突（時段被占用、已被處理、額度已達上限、影響範圍已變動）。
    - 預約規則驗證分兩類：僅依請求內容與目前時間即可判定的規則（30 分鐘單位、長度、已過去、最遠可預約日、開放時段、人數）未通過時回 400；需讀取資料庫狀態才能判定的規則（時段被占用、持有上限、週期性批數上限、預約權限暫停、場地已停用）未通過時回 409。同一請求出現多項未通過時，在同一個狀態碼下以 violations 全部列出。
    - 兩段式確認：設定維護時段、停用場地、停用帳號先呼叫影響預覽（只讀），再呼叫確認操作並帶上看過的預約識別清單；伺服器於交易內重算，清單不一致時回 409，Error.impact 附最新影響。
    - 本檔未列出僅供測試使用的 /__test/clock、/__test/tick（僅 ENABLE_TEST_CLOCK=1 時開放）與建立第一位管理員的啟動指令，它們沒有對應的外層需要。
    - 背景排程不是 HTTP 操作，其觸發條件與結果寫在頂層 x-background-jobs。
  x-common-inner-needs:
    description: 所有需登入的操作在授權前都會做階段驗證，這些讀寫不在各操作的 x-inner-needs 重複列出，資料庫端需涵蓋。
    data:
      - name: sessions
        access: read
        fields: [token_hash, user_id, expires_at]
      - name: sessions
        access: write
        fields: [expires_at]
      - name: users
        access: read
        fields: [id, is_active, must_change_password, suspended_until_at]
      - name: user_roles
        access: read
        fields: [user_id, role]
    files: []
servers:
  - url: http://127.0.0.1:3000
    description: 本機後端（正式環境同一行程也提供前端靜態檔）
tags:
  - name: 驗證與帳號
  - name: 系統
  - name: 場地管理
  - name: 維護時段
  - name: 場地搜尋與行事曆
  - name: 預約
  - name: 審核
  - name: 週期性預約
  - name: 候補
  - name: 通知
  - name: 規則
  - name: 報表
security:
  - cookieAuth: []
paths:
  /api/auth/login:
    post:
      tags: [驗證與帳號]
      summary: 登入
      operationId: login
      description: 對應 UI-01「登入」。以 Email 與密碼驗證；Email 去除前後空白並轉小寫比對。帳號不存在與密碼錯誤回應同一句，且耗時接近。密碼驗證通過後才檢查停用狀態。成功時設定 sid cookie 並回傳目前使用者。不需登入。
      security: []
      x-inner-needs:
        data:
          - name: users
            access: read
            fields:
              [
                id,
                email,
                name,
                password_hash,
                is_active,
                must_change_password,
                suspended_until_at,
              ]
          - name: user_roles
            access: read
            fields: [user_id, role]
          - name: sessions
            access: write
            fields: [token_hash, user_id, expires_at]
        files: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: 登入成功，回應同時設定 sid cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "400":
          description: 欄位未填
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Email 或密碼錯誤（兩者不分）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: 帳號已停用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/auth/logout:
    post:
      tags: [驗證與帳號]
      summary: 登出
      operationId: logout
      description: 對應 UI-01「登出」。刪除目前階段並清除 cookie。任何已登入角色可呼叫，須先改密碼的帳號也可呼叫。
      x-inner-needs:
        data:
          - name: sessions
            access: delete
            fields: [token_hash]
        files: []
      responses:
        "204":
          description: 已登出
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/auth/me:
    get:
      tags: [驗證與帳號]
      summary: 取得目前使用者
      operationId: getCurrentUser
      description: 對應所有頁面的導覽列與路由守衛（UI-01～UI-12）。回傳識別、姓名、Email、角色、是否須先改密碼與預約權限暫停解除時間（暫停已過期時為 null）。須先改密碼的帳號也可呼叫。
      x-inner-needs:
        data:
          - name: users
            access: read
            fields: [id, email, name, must_change_password, suspended_until_at]
          - name: user_roles
            access: read
            fields: [user_id, role]
        files: []
      responses:
        "200":
          description: 目前使用者
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/auth/password:
    put:
      tags: [驗證與帳號]
      summary: 變更自己的密碼
      operationId: changePassword
      description: 對應 UI-01「變更密碼」。以舊密碼驗證後設定新密碼（長度 8 到 128 個字元）；成功時清除 mustChangePassword 旗標並刪除該帳號所有階段（含目前階段），前端須回到登入頁重新登入。須先改密碼的帳號也可呼叫。
      x-inner-needs:
        data:
          - name: users
            access: write
            fields: [password_hash, must_change_password]
          - name: sessions
            access: delete
            fields: [user_id]
        files: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [oldPassword, newPassword]
              properties:
                oldPassword:
                  type: string
                newPassword:
                  type: string
                  minLength: 8
                  maxLength: 128
      responses:
        "204":
          description: 已變更，所有階段已失效
        "400":
          description: 新密碼長度不符，或舊密碼不正確；欄位錯誤放在 fields（oldPassword、newPassword）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/context:
    get:
      tags: [系統]
      summary: 取得目前台北日期與公開規則值
      operationId: getContext
      description: 回應 UI-02、UI-03、UI-04、UI-05 對「目前台北日期」與規則值的需要：伺服器目前時間、台北今天日期、最遠可預約日期（今天加最遠可預約天數），以及表單與對話框說明文字用到的規則值（單次時長上限、週期性最長月數、批數上限、持有上限、逾時取消門檻、候補確認時限與截止門檻、報到開放與截止分鐘）。所有已登入角色可呼叫，須先改密碼的帳號不可。
      x-inner-needs:
        data:
          - name: rules
            access: read
            fields: [rule_key, int_value]
        files: []
      responses:
        "200":
          description: 目前時間與規則值
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Context"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/users:
    get:
      tags: [驗證與帳號]
      summary: 列出帳號
      operationId: listUsers
      description: 對應 UI-09「瀏覽帳號清單」與 UI-08 的審核者候選。僅管理員。不分頁（規模 200 位以內）；不回傳任何密碼內容。可用 role 與 active 篩選（UI-08 取審核者候選時帶 role=reviewer、active=true）。
      x-inner-needs:
        data:
          - name: users
            access: read
            fields:
              [
                id,
                email,
                name,
                is_active,
                must_change_password,
                suspended_until_at,
              ]
          - name: user_roles
            access: read
            fields: [user_id, role]
        files: []
      parameters:
        - name: role
          in: query
          schema:
            type: string
            enum: [employee, reviewer, admin]
        - name: active
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: 帳號列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [驗證與帳號]
      summary: 建立帳號
      operationId: createUser
      description: 對應 UI-09「建立帳號」。僅管理員。Email 去除空白並轉小寫後全系統唯一；初始密碼 8 到 128 個字元，不強制首次登入改密碼；employee 角色隱含，不需傳入。
      x-inner-needs:
        data:
          - name: users
            access: write
            fields:
              [email, name, password_hash, is_active, must_change_password]
          - name: user_roles
            access: write
            fields: [user_id, role]
        files: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreateInput"
      responses:
        "201":
          description: 已建立
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: 欄位錯誤（email 格式、name 必填、password 長度），放在 fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Email 已被使用，放在 fields（email）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/users/{userId}:
    patch:
      tags: [驗證與帳號]
      summary: 編輯帳號姓名與角色
      operationId: updateUser
      description: 對應 UI-09「編輯帳號」。僅管理員；Email 不可修改。移除 reviewer 角色時，同交易內移除該帳號的場地審核者指派。不得移除最後一位啟用中管理員的 admin 角色。
      x-inner-needs:
        data:
          - name: users
            access: write
            fields: [name]
          - name: user_roles
            access: write
            fields: [user_id, role]
          - name: venue_reviewers
            access: delete
            fields: [user_id]
        files: []
      parameters:
        - $ref: "#/components/parameters/userId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdateInput"
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: 欄位錯誤（name 必填），放在 fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: 帳號不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: 不能移除最後一位管理員的管理員角色
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/users/{userId}/password:
    put:
      tags: [驗證與帳號]
      summary: 管理員重設密碼
      operationId: resetUserPassword
      description: 對應 UI-09「重設密碼」。僅管理員。設定新的臨時密碼（8 到 128 個字元），把 mustChangePassword 設為 true，並刪除該帳號所有階段，使其下次登入須先自行改密碼。密碼不會再被回傳。
      x-inner-needs:
        data:
          - name: users
            access: write
            fields: [password_hash, must_change_password]
          - name: sessions
            access: delete
            fields: [user_id]
        files: []
      parameters:
        - $ref: "#/components/parameters/userId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newPassword]
              properties:
                newPassword:
                  type: string
                  minLength: 8
                  maxLength: 128
      responses:
        "204":
          description: 已重設
        "400":
          description: 密碼長度錯誤，放在 fields（newPassword）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: 帳號不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/users/{userId}/deactivation-impact:
    get:
      tags: [驗證與帳號]
      summary: 預覽停用帳號的影響
      operationId: previewUserDeactivation
      description: 對應 UI-09「預覽停用影響」。僅管理員。只讀、不寫入。列出該帳號尚未開始、狀態為待審核或已確認的預約（週期性場次逐場列出），以及會失效的候補數（等候中與保留中）。
      x-inner-needs:
        data:
          - name: bookings
            access: read
            fields: [id, user_id, venue_id, start_at, end_at, status, series_id]
          - name: venues
            access: read
            fields: [id, name]
          - name: waitlist_entries
            access: read
            fields: [id, user_id, status]
        files: []
      parameters:
        - $ref: "#/components/parameters/userId"
      responses:
        "200":
          description: 受影響的預約與候補數
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImpactPreview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: 帳號不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/users/{userId}/deactivate:
    post:
      tags: [驗證與帳號]
      summary: 確認停用帳號
      operationId: deactivateUser
      description: 對應 UI-09「確認停用」。僅管理員。交易內重算受影響預約，與 bookingIds 一致才執行：逐筆以管理員身分取消預約（原因「管理員停用帳號」，不標記逾時取消、不計入取消率，通知預約者）、使該帳號所有等候中與保留中候補失效並釋放保留時段、將帳號停用並刪除其階段。不得停用自己，也不得停用最後一位啟用中的管理員。
      x-inner-needs:
        data:
          - name: users
            access: write
            fields: [is_active]
          - name: sessions
            access: delete
            fields: [user_id]
          - name: bookings
            access: write
            fields: [id, status, late_cancel]
          - name: booking_slots
            access: delete
            fields: [venue_id, slot_start_at, holder_type, holder_id]
          - name: booking_events
            access: write
            fields:
              [
                booking_id,
                actor_user_id,
                actor_type,
                occurred_at,
                from_status,
                to_status,
                reason,
              ]
          - name: waitlist_entries
            access: write
            fields: [id, status, close_reason, closed_at]
          - name: notifications
            access: write
            fields:
              [
                user_id,
                type,
                message,
                booking_id,
                waitlist_entry_id,
                created_at,
              ]
        files: []
      parameters:
        - $ref: "#/components/parameters/userId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImpactConfirmInput"
      responses:
        "200":
          description: 已停用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImpactResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: 帳號不存在
          content:
            application/json:
              schema:
