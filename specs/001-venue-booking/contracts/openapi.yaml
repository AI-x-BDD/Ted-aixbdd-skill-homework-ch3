                end_at,
                subject,
                attendees,
                status,
                series_id,
                late_cancel,
                confirmed_at,
                reminder_sent_at,
              ]
          - name: booking_slots
            access: write
            fields: [venue_id, slot_start_at, holder_type, holder_id]
          - name: booking_events
            access: write
            fields:
              [
                booking_id,
