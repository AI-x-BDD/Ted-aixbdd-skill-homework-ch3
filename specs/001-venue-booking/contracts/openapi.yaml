      summary: 建立單次預約
      operationId: createBooking
      description: |
        對應 UI-03「送出單次預約」。所有已登入角色皆以一般員工身分為自己預約（管理員不能代他人預約）。
        流程：先以純函式檢查 30 分鐘單位、長度（至少 30 分鐘、不超過單次時長上限）、開始時間不早於現在、日期不晚於最遠可預約日、完全落在開放時段內、人數 1 至容納人數、主題必填（至多 100 字）；任一未通過回 400 並在 violations 全部列出。通過後在交易內先鎖使用者列，檢查預約權限暫停、持有上限（週期性整批算 1 筆），再寫入預約與 30 分鐘時段占用；時段被占用、額度已達上限、暫停中或場地已停用回 409 並以 violations 說明。不需審核的場地成立即為已確認，需審核的場地為待審核並先占用時段；有審核者時通知審核者，申請者本人是審核者時改由同場地其他審核者或管理員。成立時通知預約者並留下操作紀錄。併發時同場地同時段只有一人成功。
