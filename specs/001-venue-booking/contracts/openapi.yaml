    get:
      tags: [場地搜尋與行事曆]
      summary: 取得場地日／週行事曆
      operationId: getVenueCalendar
      description: |
        對應 UI-02「開啟行事曆」「切換日／週檢視」「切換日期」。所有已登入角色可呼叫。回傳 date 所在日（view=day）或所在週一至週日（view=week）每天 48 個 30 分鐘時段的狀態，不含預約者與主題。
        時段狀態判定優先序：closed（不在開放時段內、開始時間早於現在、超過最遠可預約日）、maintenance（維護時段）、booked（有效預約或候補保留）、available（可預約）。已過去的時段一律為 closed，不論原本是否被預約。回應含目前台北日期與每天的開放區間，前端可用來裁切與判斷整天不開放。啟用中的場地才有行事曆，停用或不存在回 404。
      x-inner-needs:
        data:
          - name: venues
            access: read
            fields: [id, name, location, is_active]
          - name: venue_opening_hours
            access: read
            fields: [venue_id, weekday, open_minute, close_minute]
          - name: booking_slots
            access: read
            fields: [venue_id, slot_start_at, holder_type]
          - name: rules
            access: read
            fields: [rule_key, int_value]
        files: []
      parameters:
        - $ref: "#/components/parameters/venueId"
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: view
          in: query
          schema:
            type: string
            enum: [day, week]
            default: day
      responses:
        "200":
          description: 行事曆
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Calendar"
        "400":
          description: 日期格式不正確
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: 場地不存在或已停用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
