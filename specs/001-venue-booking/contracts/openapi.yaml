    post:
      tags: [週期性預約]
      summary: 檢查週期性預約的各場次
      operationId: previewBookingSeries
      description: |
        對應 UI-03「檢查衝突」。所有已登入角色。只讀、不寫入、不鎖定（使用 POST 只因為需要請求本文）。由第一場日期、頻率（weekly 間隔 7 天、biweekly 間隔 14 天）與最後一場日期展開場次，每場同一星期、同一起訖時間。
        整批層級檢查：第一場須符合最遠可預約日且不得已過去、最後一場不晚於第一場起算最長月數、單位與長度、人數、主題；未通過回 400（violations，rule 含 first_session_range、series_max_months 與單次規則）。持有上限、週期性批數上限與預約權限暫停以目前資料判斷，未通過回 409（rule 為 quota、series_quota、suspended）。
        逐場檢查：開放時段以外（closed）、維護時段（maintenance）、時段已被占用（occupied），每場回報是否可建立與衝突原因；後續場次不受最遠可預約日限制。全部場次都衝突時仍回 200，availableCount 為 0。
      x-inner-needs:
        data:
          - name: users
            access: read
            fields: [id, suspended_until_at]
          - name: venues
            access: read
            fields: [id, name, capacity, is_active]
          - name: venue_opening_hours
            access: read
            fields: [venue_id, weekday, open_minute, close_minute]
          - name: booking_slots
            access: read
            fields: [venue_id, slot_start_at, holder_type]
          - name: bookings
            access: read
            fields: [user_id, status, start_at, series_id]
          - name: rules
            access: read
            fields: [rule_key, int_value]
        files: []
