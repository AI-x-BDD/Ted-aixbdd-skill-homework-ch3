x-background-jobs:
  description: |
    背景排程（API-11）不是 HTTP 操作，由後端行程內的掃描驅動：每 30 秒（SCAN_INTERVAL_MS）執行一輪，若上一輪未完成則略過；「現在」取自可注入的時鐘。每種工作都是「查詢到期列加逐筆處理」：交易內以 FOR UPDATE SKIP LOCKED 取最多 100 列，逐筆經同一個狀態轉換入口（條件更新、寫操作紀錄、釋出時段、通知），單筆失敗只記錄日誌並繼續，處理到沒有到期列為止；所有判斷只看資料庫狀態與時間，行程重啟後第一輪補做所有到期工作，重複執行不會重複處理。自動處理的事件須在到期時間點後 1 分鐘內完成。
  jobs:
    - name: expirePendingReviews
      trigger: 狀態為待審核且開始時間已到（單次預約）；週期性批次以其最早一個未取消場次的開始時間判斷。
      result: 單次預約改為已取消；整批則所有未取消場次改為已取消、批次狀態（status）改為 cancelled。操作者記為系統，原因「未於開始前完成審核」，不標記逾時取消；釋出時段並對釋出範圍呼叫候補遞補掛勾；通知預約者。
      x-inner-needs:
        data:
          - name: bookings
            access: write
            fields: [id, user_id, venue_id, start_at, status, series_id]
          - name: booking_series
            access: write
            fields: [id, status]
          - name: booking_slots
            access: delete
            fields: [venue_id, slot_start_at, holder_type, holder_id]
          - name: booking_events
            access: write
            fields:
              [
                booking_id,
                actor_user_id,
                actor_type,
                occurred_at,
                from_status,
                to_status,
                reason,
              ]
          - name: waitlist_entries
            access: write
            fields:
              [
                id,
                venue_id,
                start_at,
                end_at,
                status,
                offer_expires_at,
                created_at,
              ]
          - name: notifications
            access: write
            fields:
              [
                user_id,
                type,
                message,
                booking_id,
                waitlist_entry_id,
                created_at,
              ]
          - name: rules
            access: read
            fields: [rule_key, int_value]
        files: []
    - name: markNoShows
      trigger: 狀態為已確認，且現在已超過報到截止（開始時間加報到截止分鐘，與結束時間取較早者）。
      result: 改為未到場，操作者記為系統；剩餘時段釋出（保留已過去部分，釋出從判定時間之後的下一個整點或半點起）並呼叫候補遞補掛勾；為預約者記錄一次未到場；在同一交易內鎖使用者列，計算統計天數內且晚於 no_show_counted_from_at 的未到場次數，達門檻時把 suspended_until_at 設為現在加暫停天數、no_show_counted_from_at 設為 suspended_until_at，並通知預約者權限暫停與解除時間。暫停期滿不需工作，以 suspended_until_at 與目前時間比較。
      x-inner-needs:
        data:
          - name: bookings
            access: write
            fields: [id, user_id, venue_id, start_at, end_at, status]
          - name: booking_slots
            access: delete
            fields: [venue_id, slot_start_at, holder_type, holder_id]
          - name: booking_events
            access: write
            fields:
              [
                booking_id,
                actor_user_id,
                actor_type,
                occurred_at,
                from_status,
                to_status,
                reason,
              ]
          - name: booking_events
            access: read
            fields: [booking_id, actor_user_id, to_status, occurred_at]
          - name: users
            access: write
            fields: [id, suspended_until_at, no_show_counted_from_at]
          - name: waitlist_entries
            access: write
            fields:
              [
                id,
                venue_id,
                start_at,
                end_at,
                status,
                offer_expires_at,
                created_at,
              ]
          - name: notifications
            access: write
            fields:
              [
                user_id,
                type,
                message,
                booking_id,
                waitlist_entry_id,
                created_at,
              ]
          - name: rules
            access: read
            fields: [rule_key, int_value]
        files: []
    - name: completeCheckedIn
      trigger: 狀態為已報到且結束時間已到。
      result: 改為已完成，操作者記為系統；時段列保留到清理工作刪除。
      x-inner-needs:
        data:
          - name: bookings
            access: write
            fields: [id, end_at, status]
          - name: booking_events
            access: write
            fields:
              [
                booking_id,
                actor_user_id,
                actor_type,
                occurred_at,
                from_status,
                to_status,
                reason,
              ]
        files: []
    - name: sendReminders
      trigger: 狀態為已確認、尚未提醒（reminder_sent_at 為空）、現在已進入「開始時間減提醒分鐘」之後且開始時間未到，且確認時間不晚於「開始時間減提醒分鐘」（成立時距開始已不足提醒時間者不提醒；待審核不提醒）。
      result: 通知預約者開始前提醒並寫入 reminder_sent_at；修改時間或場地後重新確認時 confirmed_at 更新且 reminder_sent_at 清空，由本工作重新判斷。
      x-inner-needs:
        data:
          - name: bookings
            access: write
            fields:
              [
                id,
                user_id,
                venue_id,
                start_at,
                status,
                confirmed_at,
                reminder_sent_at,
              ]
          - name: venues
            access: read
            fields: [id, name]
          - name: notifications
            access: write
            fields: [user_id, type, message, booking_id, created_at]
          - name: rules
            access: read
            fields: [rule_key, int_value]
        files: []
    - name: expireWaitlistOffers
      trigger: 候補為保留中且保留到期時間已到。
      result: 候補改為失效（原因 offer_timeout）、刪除保留的時段列，通知候補者失效，並呼叫候補遞補掛勾由下一位接手；若此時距開始已在候補截止門檻內，不再通知下一位，時段開放所有人預約。
      x-inner-needs:
        data:
          - name: waitlist_entries
            access: write
            fields:
              [
                id,
                user_id,
                venue_id,
                start_at,
                end_at,
                status,
                offer_expires_at,
                close_reason,
                closed_at,
                created_at,
              ]
          - name: booking_slots
            access: delete
            fields: [venue_id, slot_start_at, holder_type, holder_id]
          - name: notifications
            access: write
            fields: [user_id, type, message, waitlist_entry_id, created_at]
          - name: rules
            access: read
            fields: [rule_key, int_value]
        files: []
    - name: expireStartedWaitlist
      trigger: 候補為等候中或保留中且候補時段的開始時間已到。
      result: 候補改為失效（原因 started）、刪除保留的時段列，通知候補者失效。
      x-inner-needs:
        data:
          - name: waitlist_entries
            access: write
            fields:
              [id, user_id, venue_id, start_at, status, close_reason, closed_at]
          - name: booking_slots
            access: delete
            fields: [venue_id, slot_start_at, holder_type, holder_id]
          - name: notifications
            access: write
            fields: [user_id, type, message, waitlist_entry_id, created_at]
        files: []
    - name: retryWaitlistOffers
      trigger: 每一輪對仍在等候中的候補重新跑一次遞補掛勾，作為保險。
      result: 候補登記時段的所有時段列都已空出且現在早於開始時間減候補截止門檻時，按登記先後把第一順位改為保留中、保留到期時間設為現在加候補確認時限、以 hold 占用時段並通知；對象為預約權限暫停者時直接判為失效（原因 confirm_failed）並處理下一位；部分空出不遞補。
      x-inner-needs:
        data:
          - name: waitlist_entries
            access: write
            fields:
              [
                id,
                user_id,
                venue_id,
                start_at,
                end_at,
                status,
                offer_expires_at,
                close_reason,
                closed_at,
                created_at,
              ]
          - name: booking_slots
            access: write
            fields: [venue_id, slot_start_at, holder_type, holder_id]
          - name: users
            access: read
            fields: [id, suspended_until_at]
          - name: notifications
            access: write
            fields: [user_id, type, message, waitlist_entry_id, created_at]
          - name: rules
            access: read
            fields: [rule_key, int_value]
        files: []
    - name: purgeOldSlots
      trigger: 時段列的 slot_start_at 早於 1 天前。
      result: 刪除這些時段列（已完成預約的時段列保留到此時）。
      x-inner-needs:
        data:
          - name: booking_slots
            access: delete
            fields: [venue_id, slot_start_at]
        files: []
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sid
      description: 登入後由伺服器設定的 HttpOnly 階段憑證
  responses:
    Unauthorized:
      description: 未登入或登入已逾時
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: 沒有權限、必須先改密碼（訊息「請先設定新密碼」），或請求來源不被允許
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  parameters:
    userId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
    venueId:
      name: venueId
      in: path
      required: true
      schema:
        type: integer
    windowId:
      name: windowId
      in: path
      required: true
      schema:
        type: integer
    bookingId:
      name: bookingId
      in: path
      required: true
      schema:
        type: integer
    seriesId:
      name: seriesId
      in: path
      required: true
      schema:
        type: integer
    entryId:
      name: entryId
      in: path
      required: true
      schema:
        type: integer
    notificationId:
      name: notificationId
      in: path
      required: true
      schema:
        type: integer
    ruleKey:
      name: ruleKey
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/RuleKey"
    limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    reportFrom:
      name: from
      in: query
      required: true
      schema:
        type: string
        format: date
    reportTo:
      name: to
      in: query
      required: true
      schema:
        type: string
        format: date
  schemas:
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: 繁體中文，說明發生什麼與可以怎麼做，不含內部代碼或技術細節
          examples:
            - Email 或密碼錯誤。請確認後再試一次。
            - 該時段已被占用。請改選其他時段，或登記候補。
            - 此申請已被處理。清單已更新。
            - 請先設定新密碼。
            - 受影響的預約已有變動，尚未停用。請確認最新清單後再試一次。
        fields:
          type: array
          description: 欄位層級的錯誤，供前端標示在欄位下方
          items:
            $ref: "#/components/schemas/FieldError"
        violations:
          type: array
          description: 預約相關操作未通過的規則清單，每項含規則代號與說明
          items:
            $ref: "#/components/schemas/Violation"
        conflicts:
          type: array
          description: 週期性預約送出時重新檢查發現的最新衝突場次
          items:
            $ref: "#/components/schemas/SeriesSessionCheck"
        impact:
          description: 兩段式確認時影響範圍已變動，附上最新影響
          $ref: "#/components/schemas/ImpactPreview"
    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          description: 對應請求欄位名稱，例如 email、capacity、openingHours、reviewerIds、maintenance、reason
        message:
          type: string
    Violation:
      type: object
      required: [rule, message]
      properties:
        rule:
          type: string
          enum:
            - time_unit
            - duration
            - end_not_after_start
            - past
            - advance
            - opening_hours
            - capacity
            - occupied
            - quota
            - suspended
            - venue_inactive
            - series_range
            - series_pending
            - started
            - status
            - not_in_window
            - first_session_range
            - series_max_months
            - series_quota
            - no_sessions
            - slot_free
            - maintenance
            - already_waiting
            - offer_expired
            - not_offered
        message:
          type: string
          description: 繁體中文，說明未通過的原因與可以怎麼做；暫停與逾時類訊息含解除時間或可報到時間
    TimeOfDay:
      type: string
      pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
      description: 台北當地時間 HH:mm
    EndTimeOfDay:
      type: string
      pattern: "^(([01][0-9]|2[0-3]):[0-5][0-9]|24:00)$"
      description: 台北當地時間 HH:mm，24:00 表示當日結束
    Role:
      type: string
      enum: [employee, reviewer, admin]
    CurrentUser:
      type: object
      required: [id, name, email, roles, mustChangePassword, suspendedUntil]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
        mustChangePassword:
          type: boolean
        suspendedUntil:
          type: ["string", "null"]
          format: date-time
          pattern: "Z$"
          description: 預約權限暫停解除時間；未暫停或已過期為 null
    User:
      type: object
      required:
        [id, email, name, roles, active, mustChangePassword, suspendedUntil]
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
        active:
          type: boolean
        mustChangePassword:
          type: boolean
        suspendedUntil:
          type: ["string", "null"]
          format: date-time
          pattern: "Z$"
    UserList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"
    UserCreateInput:
      type: object
      required: [email, name, password, roles]
      properties:
        email:
          type: string
        name:
          type: string
        password:
          type: string
          minLength: 8
          maxLength: 128
        roles:
          type: array
          description: 額外角色；employee 隱含，傳入也會被忽略
          items:
            $ref: "#/components/schemas/Role"
    UserUpdateInput:
      type: object
      required: [name, roles]
      properties:
        name:
          type: string
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
    Context:
      type: object
      required: [now, today, maxBookableDate, rules]
      properties:
        now:
          type: string
          format: date-time
          pattern: "Z$"
          description: 伺服器目前時間（UTC）
        today:
          type: string
          format: date
          description: 目前台北日期
        maxBookableDate:
          type: string
          format: date
          description: 今天起算最遠可預約日期（含）
        rules:
          $ref: "#/components/schemas/RuleValues"
    RuleValues:
      type: object
      description: 規則目前值，一律以儲存單位表示（時間類為分鐘）
      required:
        [
          maxDurationMinutes,
          maxAdvanceDays,
          maxActiveBookings,
          maxActiveSeries,
          maxSeriesMonths,
          lateCancelMinutes,
          waitlistConfirmMinutes,
          waitlistCutoffMinutes,
          checkinOpenMinutes,
          checkinCloseMinutes,
        ]
      properties:
        maxDurationMinutes:
          type: integer
        maxAdvanceDays:
          type: integer
        maxActiveBookings:
          type: integer
        maxActiveSeries:
          type: integer
        maxSeriesMonths:
          type: integer
        lateCancelMinutes:
          type: integer
        waitlistConfirmMinutes:
          type: integer
        waitlistCutoffMinutes:
          type: integer
        checkinOpenMinutes:
          type: integer
        checkinCloseMinutes:
          type: integer
    ImpactBooking:
      type: object
      required:
        [bookingId, bookerName, venueName, date, startTime, endTime, status]
      properties:
        bookingId:
          type: integer
        bookerName:
          type: string
        venueName:
          type: string
        date:
          type: string
          format: date
        startTime:
          $ref: "#/components/schemas/TimeOfDay"
        endTime:
          $ref: "#/components/schemas/EndTimeOfDay"
        status:
          $ref: "#/components/schemas/BookingStatus"
    ImpactPreview:
      type: object
      required: [bookings, waitlistCount]
      properties:
        bookings:
          type: array
          items:
            $ref: "#/components/schemas/ImpactBooking"
        waitlistCount:
          type: integer
          description: 會失效的候補數；維護時段預覽恆為 0
    ImpactConfirmInput:
      type: object
      required: [bookingIds]
      properties:
        bookingIds:
          type: array
          description: 管理員在預覽中看過的預約識別；伺服器重算後必須完全一致
          items:
            type: integer
    ImpactResult:
      type: object
      required: [cancelledBookingCount, expiredWaitlistCount]
      properties:
        cancelledBookingCount:
          type: integer
        expiredWaitlistCount:
          type: integer
    OpeningHour:
      type: object
      required: [weekday, startTime, endTime]
      properties:
        weekday:
          type: integer
          minimum: 0
          maximum: 6
          description: 0 為週日
        startTime:
          $ref: "#/components/schemas/TimeOfDay"
        endTime:
          $ref: "#/components/schemas/EndTimeOfDay"
    ReviewerRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
    Venue:
      type: object
      required:
        [
          id,
          name,
          location,
          capacity,
          equipment,
          requiresApproval,
          openingHours,
        ]
      properties:
        id:
          type: integer
        name:
          type: string
        location:
          type: string
        capacity:
          type: integer
        equipment:
          type: array
          items:
            type: string
        requiresApproval:
          type: boolean
        openingHours:
          type: array
          items:
            $ref: "#/components/schemas/OpeningHour"
    VenueList:
      type: object
      required: [items, equipmentOptions]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Venue"
        equipmentOptions:
          type: array
          description: 啟用中場地出現過的設備名稱，去重後排序
          items:
            type: string
    AdminVenue:
      allOf:
        - $ref: "#/components/schemas/Venue"
        - type: object
          required: [active, reviewers]
          properties:
            active:
              type: boolean
            reviewers:
              type: array
              items:
                $ref: "#/components/schemas/ReviewerRef"
    AdminVenueList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminVenue"
    VenueInput:
      type: object
      required:
        [
          name,
          location,
          capacity,
          equipment,
          requiresApproval,
          reviewerIds,
          openingHours,
        ]
      properties:
        name:
          type: string
        location:
          type: string
        capacity:
          type: integer
          minimum: 1
        equipment:
          type: array
          items:
            type: string
        requiresApproval:
          type: boolean
        reviewerIds:
          type: array
          description: 審核者帳號識別；requiresApproval 為 true 時至少一位
          items:
            type: integer
        openingHours:
          type: array
          items:
            $ref: "#/components/schemas/OpeningHour"
    Calendar:
      type: object
      required: [venue, today, view, from, to, days]
      properties:
        venue:
          type: object
          required: [id, name, location]
          properties:
            id:
              type: integer
            name:
              type: string
            location:
              type: string
        today:
          type: string
          format: date
          description: 目前台北日期
        view:
          type: string
          enum: [day, week]
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        days:
          type: array
          items:
            $ref: "#/components/schemas/CalendarDay"
    CalendarDay:
      type: object
      required: [date, weekday, openRanges, slots]
      properties:
        date:
          type: string
          format: date
        weekday:
          type: integer
          minimum: 0
          maximum: 6
        openRanges:
          type: array
          description: 該日的開放區間（不扣除已過去與超過最遠可預約日的部分）；空陣列表示整天不開放
          items:
            type: object
            required: [startTime, endTime]
            properties:
              startTime:
                $ref: "#/components/schemas/TimeOfDay"
              endTime:
                $ref: "#/components/schemas/EndTimeOfDay"
