    BookingStatus:
      type: string
      enum:
        [
          pending,
          confirmed,
          checked_in,
          completed,
          rejected,
          cancelled,
          no_show,
        ]
      description: 待審核、已確認、已報到、已完成、已駁回、已取消、未到場
    BookingInput:
      type: object
      required: [venueId, date, startTime, endTime, subject, attendees]
      properties:
        venueId:
          type: integer
        date:
          type: string
          format: date
        startTime:
          $ref: "#/components/schemas/TimeOfDay"
        endTime:
          $ref: "#/components/schemas/EndTimeOfDay"
        subject:
          type: string
          maxLength: 100
        attendees:
          type: integer
          minimum: 1
    Booking:
      type: object
      required:
        [
          id,
          venueId,
          venueName,
          date,
          startTime,
          endTime,
          startAt,
          endAt,
          subject,
          attendees,
          status,
          lateCancel,
        ]
      properties:
        id:
          type: integer
        venueId:
          type: integer
        venueName:
          type: string
        date:
          type: string
          format: date
        startTime:
          $ref: "#/components/schemas/TimeOfDay"
        endTime:
          $ref: "#/components/schemas/EndTimeOfDay"
        startAt:
          type: string
          format: date-time
          pattern: "Z$"
        endAt:
          type: string
          format: date-time
          pattern: "Z$"
        subject:
          type: string
        attendees:
          type: integer
        status:
          $ref: "#/components/schemas/BookingStatus"
        lateCancel:
          type: boolean
    SeriesStatus:
      type: string
      enum: [pending, confirmed, rejected, cancelled]
      description: |
        週期性預約批次狀態代碼（C-SH-01），與預約狀態共用同一組英文 snake_case 代碼：pending 待審核（整批尚未審核）、confirmed 已確認（整批審核通過，或不需審核的場地直接成立）、rejected 已駁回（整批被駁回）、cancelled 已取消（整批所有場次皆已取消，含未於開始前完成審核而由系統取消）。批次沒有 checked_in、completed、no_show：報到、完成與未到場由各場次各自判定（FR-057）。
    SeriesInfo:
      type: object
      required: [seriesId, index, total, lastDate, status, pendingApproval]
      properties:
        seriesId:
          type: integer
        status:
          $ref: "#/components/schemas/SeriesStatus"
        index:
          type: integer
          description: 第 n 場（從 1 起）
        total:
          type: integer
          description: 該批原有總場次數（含已取消）
        lastDate:
          type: string
          format: date
          description: 同批最後一場日期
        pendingApproval:
          type: boolean
          description: 整批是否仍待審核；恆等於 status 為 pending
    MyBooking:
      allOf:
        - $ref: "#/components/schemas/Booking"
        - type: object
          required:
            [
              series,
              statusReason,
              statusActor,
              canCancel,
              canEdit,
              editBlockedReason,
              canCheckIn,
              checkInWindow,
            ]
          properties:
            series:
              oneOf:
                - $ref: "#/components/schemas/SeriesInfo"
                - type: "null"
            statusReason:
              type: ["string", "null"]
              description: 駁回或取消的原因（最近一次轉為已駁回、已取消的紀錄）
            statusActor:
              type: ["string", "null"]
              enum: [user, reviewer, admin, system, null]
              description: 駁回或取消的操作者類型（user 為本人）
            canCancel:
              type: boolean
              description: 待審核或已確認且尚未開始
            canEdit:
              type: boolean
              description: 待審核或已確認、尚未開始，且不是整批仍待審核的場次
            editBlockedReason:
              type: ["string", "null"]
              enum: [series_pending, started, status, null]
              description: canEdit 為 false 時的原因
            canCheckIn:
              type: boolean
              description: 已確認且目前在報到時間內
            checkInWindow:
              oneOf:
                - type: object
                  required: [startAt, endAt]
                  properties:
                    startAt:
                      type: string
                      format: date-time
                      pattern: "Z$"
                    endAt:
                      type: string
                      format: date-time
                      pattern: "Z$"
                - type: "null"
              description: 已確認時的可報到起訖（報到截止晚於結束時間時以結束時間為準）
    MyBookingList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MyBooking"
        total:
          type: integer
    CancelResult:
      type: object
      required: [cancelledCount, cancelled]
      properties:
