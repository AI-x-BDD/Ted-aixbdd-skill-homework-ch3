        id:
          type: integer
        venueId:
          type: integer
        startDate:
          type: string
          format: date
        startTime:
          $ref: "#/components/schemas/TimeOfDay"
        endDate:
          type: string
          format: date
        endTime:
          $ref: "#/components/schemas/EndTimeOfDay"
        startAt:
          type: string
          format: date-time
          pattern: "Z$"
        endAt:
          type: string
          format: date-time
          pattern: "Z$"
    MaintenanceWindowList:
      type: object
      required: [items]
