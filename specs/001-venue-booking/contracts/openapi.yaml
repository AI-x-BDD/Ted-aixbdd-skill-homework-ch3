  /api/venues:
    get:
      tags: [場地搜尋與行事曆]
      summary: 搜尋啟用中的場地
      operationId: searchVenues
      description: |
        對應 UI-02「瀏覽場地列表」「設定篩選」，以及 UI-03、UI-05 的啟用場地列表。所有已登入角色可呼叫。只回傳啟用中的場地；不帶條件時列出全部啟用場地。
        篩選規則：給 date 與 startTime、endTime 時，只列出該時段完全可預約的場地（啟用、完全落在開放時段內、未過去、未超過最遠可預約日、沒有有效預約／候補保留／維護時段占用）；只給 date 時，列出當日至少有一個可預約時段的場地；給了時間卻沒給 date 回 400。capacity 為最小容納人數；equipment 可重複，場地須具備所有指定設備。startTime、endTime 須成對出現，結束須晚於開始，否則 400 並在 fields 標示。
        回應另附 equipmentOptions（啟用中場地出現過的設備名稱，供篩選勾選）。
      x-inner-needs:
        data:
          - name: venues
            access: read
            fields:
              [
                id,
                name,
                location,
                capacity,
                equipment,
                requires_approval,
                is_active,
              ]
          - name: venue_opening_hours
            access: read
            fields: [venue_id, weekday, open_minute, close_minute]
          - name: booking_slots
            access: read
            fields: [venue_id, slot_start_at]
          - name: rules
            access: read
            fields: [rule_key, int_value]
        files: []
      parameters:
        - name: date
          in: query
          schema:
            type: string
            format: date
        - name: startTime
          in: query
          schema:
            $ref: "#/components/schemas/TimeOfDay"
        - name: endTime
          in: query
          schema:
            $ref: "#/components/schemas/EndTimeOfDay"
        - name: capacity
          in: query
          schema:
            type: integer
            minimum: 1
        - name: equipment
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
      responses:
        "200":
          description: 符合條件的啟用場地（可為空陣列）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenueList"
        "400":
          description: 篩選條件不合法（結束不晚於開始、只給時間沒給日期、人數不是正整數），欄位放在 fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
