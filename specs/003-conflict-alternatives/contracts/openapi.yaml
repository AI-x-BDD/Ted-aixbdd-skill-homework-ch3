openapi: 3.1.0
info:
  title: 場地／會議室預約系統 API（003 預約衝突時推薦替代時段／場地增量）
  version: 1.2.0
  description: |
    本檔是 001-venue-booking、002-rebook-reservation 後端 API 在「預約衝突時推薦替代時段／場地」功能下的增量契約，只收錄本功能前端（UI-01、UI-02）會呼叫、且行為有變動的兩個操作：建立單次預約（plan.md API-01，一般預約與再預約共用）與修改預約（plan.md API-02）。兩個操作的請求、成功回應與全部錯誤都在本檔完整寫出；其餘操作（登入、取得目前使用者、取得規則值、搜尋場地、取得單筆預約、候補等）行為不變，沿用 001、002 的契約，本檔不重複。

    本功能不新增端點、資料表、欄位或遷移（plan.md 結構決策；research.md R-01、R-04）。唯一的契約變更：
    1. 兩個操作因時段重疊（occupied）而被拒絕，且 `violations` 只剩 occupied 一項時，失敗回應新增選用欄位 `suggestions`（同場地空檔與其他可用場地），供 UI-01、UI-02 顯示。
    2. 「時段被占用」從原本「寫入時才發現、只在其他規則都通過後才可能出現」改為在規則檢查階段以唯讀方式先判定，因此與其他未通過的規則在同一次回應中並列（FR-008、FR-017），例如同時違反人數上限、持有上限或預約權限暫停時，occupied 與它們一起列在 `violations`，且不附 `suggestions`。
    3. 暫停（suspended）與持有上限（quota）改為兩者都檢查後一併列出（原本遇到暫停就先停止），讓「顯示所有未通過的規則」成立。

    共通約定（與 001、002 相同）：
    - 認證：登入後由伺服器設定 HttpOnly cookie `sid`。除登入外所有操作都需登入，未登入回 401。帳號被標示為須先改密碼（mustChangePassword）時一律 403，訊息為「請先設定新密碼」。非 GET 請求須為 application/json，且帶有 Origin 標頭時必須屬於允許的來源，否則 403。
    - 角色：employee（所有帳號皆具備）、reviewer、admin。授權以伺服器為準，略過畫面直接送出也會被拒絕。
    - 時間格式（C-SH-02）：回應與資料結構中所有時間點屬性（名稱以 At 結尾，例如 startAt、endAt）一律為 `type: string`、`format: date-time` 的帶 Z 的 ISO 8601 UTC 字串，例如 `2026-11-20T02:00:00.000Z`；替代建議的起訖也是如此，前端自行換算為台北時間顯示與填回表單。使用者輸入的預約時間一律為台北當地（UTC+8）的 `date`（YYYY-MM-DD）加 `startTime`、`endTime`（HH:mm），不接受帶時區或偏移量的時間戳，由伺服器轉為 UTC。結束時間可為 `24:00`（表示當日結束）；開始時間最晚 `23:30`。x-inner-needs 中表示時間點的資料欄位一律以 `_at` 結尾且為 UTC（例如 start_at、suspended_until_at、slot_start_at）；`open_minute`、`close_minute` 為台北當地一天內的分鐘數，不是時間點。回應給畫面顯示的錯誤訊息若含時間，一律以台北時間（UTC+8）書寫。
    - 狀態代碼（C-SH-01）：預約狀態（BookingStatus）為 pending、confirmed、checked_in、completed、rejected、cancelled、no_show，為英文 snake_case 代碼，與資料庫 CHECK 清單及前端 shared/src/copy.js 逐字相同，中文名稱只作顯示文案。本功能的成功回應只會出現 pending（場地需審核）與 confirmed（場地不需審核）；「需審核」是場地屬性 `requiresApproval`，不是預約狀態代碼。
    - 「現在」一律由伺服器判定：時段是否已過去、可預約的最遠日、建議的候選範圍都以伺服器時間計算，前端不以裝置時鐘判斷，也不自行計算空檔、不自行篩選場地。
    - 錯誤：失敗回應一律為 Error 結構，訊息為繁體中文，說明發生什麼事與可以怎麼做，不含內部代碼或技術細節。狀態碼：400 格式或規則驗證未通過、401 未登入、403 無權限、404 資源不存在、409 與目前狀態衝突。預約規則驗證分兩類：僅依請求內容與目前時間即可判定的規則（time_unit、end_not_after_start、duration、past、advance、opening_hours、capacity、series_range）未通過時回 400；需讀取資料庫狀態才能判定的規則（occupied、quota、suspended、venue_inactive 與修改預約的 started、status、series_pending）未通過時回 409。同一請求出現多項未通過時，在同一個狀態碼下以 violations 全部列出；兩類並存時回 400，並把 409 類規則（例如 occupied）一併列入同一份 violations。畫面以 `Violation.rule` 代碼決定顯示的文案，`message` 為後備說明。
    - 替代建議的隱私（NFR-003、SC-006）：`suggestions` 只含時間點與場地公開欄位（識別、名稱、容納人數、是否需審核），計算時只讀取時段占用表的場地與時段起點，不查詢也不回傳占用者、預約主題或人數；`message` 與 `violations` 也不含這些資訊。
    - 本檔未列出僅供測試使用的 /__test/clock、/__test/tick。
  x-common-inner-needs:
    description: 所有需登入的操作在授權前都會做階段驗證，這些讀寫不在各操作的 x-inner-needs 重複列出，資料庫端需涵蓋。
    data:
      - name: sessions
        access: read
        fields: [token_hash, user_id, expires_at]
      - name: sessions
        access: write
        fields: [expires_at]
      - name: users
        access: read
        fields: [id, is_active, must_change_password, suspended_until_at]
      - name: user_roles
        access: read
        fields: [user_id, role]
    files: []
servers:
  - url: http://127.0.0.1:3000
    description: 本機後端（正式環境同一行程也提供前端靜態檔）
tags:
  - name: 預約
security:
  - cookieAuth: []
paths:
  /api/bookings:
    post:
      tags: [預約]
      summary: 建立單次預約（一般預約與再預約共用，撞期時附替代建議）
      operationId: createBooking
      description: |
        對應 UI-01「看見同場地空檔建議」「看見當天已無空檔」「與其他規則並列時不顯示建議」「送出由建議帶入的時段」與 UI-02「看見其他可用場地」「看見此時段沒有其他可用場地」「與其他規則並列時不顯示建議」「送出由建議帶入的場地」對內層的需要，也是 001 UI-03「送出單次預約」與 002 UI-02「送出再預約」的同一個操作。一般預約與再預約在後端沒有差異（請求不含來源預約識別），後端無法也不需要區分；「再預約不顯示其他場地」由前端依網址是否帶 `from` 決定，後端一律回傳兩種建議（FR-016）。所有已登入角色皆以一般員工身分為自己預約。

        流程：
        1. 驗證主題（必填、至多 100 字）與人數（1 以上整數），不合法回 400 並在 fields 列出。
        2. 讀取場地（不存在回 404、已停用回 409 venue_inactive，兩者都不附建議）。
        3. 以純函式一次收集 time_unit、end_not_after_start、duration、past、advance、opening_hours、capacity 的違規。
        4. 在交易內鎖使用者列，檢查預約權限暫停（suspended，訊息含台北時間的解除時間）與持有上限（quota，週期性整批算 1 筆），兩者都檢查、都列出。
        5. 時段占用以唯讀方式判定：time_unit、end_not_after_start 未通過（時間格式本身不合法）時略過；否則查詢所選場地在所選區間內是否已有時段占用（有效預約、候補保留、維護時段，皆在同一張時段占用表），有則在 violations 追加 `occupied`（FR-008、FR-017）。
        6. 若 violations 非空，整個交易不寫入任何資料，依下列規則回應。若 violations 為空才寫入預約與 30 分鐘時段占用；寫入時若因併發而主鍵衝突（兩人幾乎同時送出），回滾後同樣回 409 occupied，並在新的唯讀交易內以最新占用狀況計算 suggestions（FR-007、NFR-002）。

        狀態碼：violations 中只要有 400 類規則就回 400，否則有 409 類規則回 409；同一份 violations 全部列出，順序為 400 類在前。

        `suggestions` 的出現條件（FR-001、FR-008、FR-010、FR-017）：只有當 violations 恰好只有 `occupied` 一項（即回 409 且唯一未通過的規則是時段被占用）時才附上；其他任何情形（占用併人數、開放時段、日期、長度、持有上限、預約權限暫停等任一規則）都不附，前端只顯示規則清單與「登記候補」。`suggestions` 為選用欄位，不認識它的舊版前端忽略即可。內容：
        - `slots`（同場地空檔，FR-002～FR-004）：同一台北日期、長度與所選相同；從所選場地當天所有以 30 分鐘為單位的候選起點中，`before` 取開始時間早於所選、離所選開始時間最近且成立者，`after` 取開始時間晚於所選、最近且成立者，各最多 1 個，不跨日。成立條件為候選時段通過與一般單次預約完全相同的規則檢查（30 分鐘單位、長度上限、不早於現在、最遠可預約日、落在開放時段內、人數不超過容納人數，規則值取目前設定，與送出時用同一份實作，SC-002），且候選涵蓋的每個 30 分鐘都沒有時段占用（含維護時段、候補保留）。任一方向找不到時該方向為 null；兩個方向都 null 時 `noSlotsToday` 為 true。
        - `venues`（其他可用場地，FR-010～FR-013、FR-018）：排除所選場地，只列啟用中、所選日期與起訖完全落在開放時段內、該時段沒有時段占用、容納人數不小於預約人數的場地；不比對設備與地點。排序為不需審核者在前、需審核者在後，各自依場地名稱（zh-Hant）排序，最多 5 個；沒有符合者為空陣列。每個場地帶 `requiresApproval`，前端據此標示「需審核」（FR-012）。

        併發與一致性：建議只是唯讀計算，不保留任何時段、不寫入資料（NFR-002）。點選建議後送出仍走本操作的完整流程，由時段占用表的主鍵與交易保證不會出現重疊的有效預約；建議顯示後狀況改變時，失敗回應重新附上依最新狀況計算的建議。回應時間：含 suggestions 的完整失敗回應須在 2 秒內回傳（NFR-001，001 預設資料量下）。

        成立時：不需審核的場地為 confirmed，需審核的場地為 pending 並先占用時段；新預約的 series_id 為空，不屬於任何週期性預約批次；通知與操作紀錄同 001、002。
      x-inner-needs:
        data:
          - name: users
            access: read
            fields: [id, suspended_until_at]
          - name: venues
            access: read
            fields: [id, name, capacity, requires_approval, is_active]
          - name: venue_opening_hours
            access: read
            fields: [venue_id, weekday, open_minute, close_minute]
          - name: venue_reviewers
            access: read
            fields: [venue_id, user_id]
          - name: rules
            access: read
            fields: [rule_key, int_value]
          - name: bookings
            access: read
            fields: [user_id, status, start_at, end_at, series_id]
          - name: bookings
            access: write
            fields:
              [
                user_id,
                venue_id,
                start_at,
                end_at,
                subject,
                attendees,
                status,
                series_id,
                late_cancel,
                confirmed_at,
                reminder_sent_at,
              ]
          - name: booking_slots
            access: read
            fields: [venue_id, slot_start_at]
          - name: booking_slots
            access: write
            fields: [venue_id, slot_start_at, holder_type, holder_id]
          - name: booking_events
            access: write
            fields:
              [
                booking_id,
                actor_user_id,
                actor_type,
                occurred_at,
                from_status,
                to_status,
                reason,
              ]
          - name: notifications
            access: write
            fields: [user_id, type, message, booking_id, created_at]
        files: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingInput"
      responses:
        "201":
          description: 預約已成立（confirmed）或已送出等待審核（pending）；回應的 status 供前端顯示含新預約狀態的成功提示
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          description: |
            未通過的規則（violations：time_unit、end_not_after_start、duration、past、advance、opening_hours、capacity）或欄位錯誤（fields：subject、attendees）。若同時有時段被占用、持有上限或預約權限暫停，也一併列在同一份 violations（FR-008、FR-017）；本情形一律不附 suggestions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                occupiedWithCapacity:
                  summary: 時段被占用，同時人數超過容納人數
                  value:
                    message: 人數超過容納人數（可容納 4 人）。請減少人數或改選其他場地。
                    violations:
                      - rule: capacity
                        message: 人數超過容納人數（可容納 4 人）。請減少人數或改選其他場地。
                      - rule: occupied
                        message: 該時段已被占用。請改選其他時段，或登記候補。
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: 場地不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: |
            時段已被占用（occupied）、已達持有上限（quota）、預約權限暫停（suspended，訊息含台北時間的解除時間）、場地已停用（venue_inactive）。violations 只有 occupied 一項時附 suggestions；occupied 與 quota 或 suspended 並列時不附；venue_inactive 不附
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                occupiedWithSuggestions:
                  summary: 只有時段被占用，附同場地空檔與其他可用場地
                  value:
                    message: 該時段已被占用。請改選其他時段，或登記候補。
                    violations:
                      - rule: occupied
                        message: 該時段已被占用。請改選其他時段，或登記候補。
                    suggestions:
                      slots:
                        before:
                          startAt: "2026-11-20T01:00:00.000Z"
                          endAt: "2026-11-20T02:00:00.000Z"
                        after:
                          startAt: "2026-11-20T03:00:00.000Z"
                          endAt: "2026-11-20T04:00:00.000Z"
                      noSlotsToday: false
                      venues:
                        - venueId: 3
                          name: 星河會議室
                          capacity: 10
                          requiresApproval: false
                        - venueId: 5
                          name: 雲端討論室
                          capacity: 10
                          requiresApproval: true
                occupiedNoSlotsToday:
                  summary: 當天已無空檔，也沒有其他可用場地
                  value:
                    message: 該時段已被占用。請改選其他時段，或登記候補。
                    violations:
                      - rule: occupied
                        message: 該時段已被占用。請改選其他時段，或登記候補。
                    suggestions:
                      slots:
                        before: null
                        after: null
                      noSlotsToday: true
                      venues: []
                occupiedWithQuota:
                  summary: 時段被占用，同時已達持有上限（不附建議）
                  value:
                    message: 該時段已被占用。請改選其他時段，或登記候補。
                    violations:
                      - rule: occupied
                        message: 該時段已被占用。請改選其他時段，或登記候補。
                      - rule: quota
                        message: 已達持有上限（最多 5 筆）。請先取消或等待既有預約結束後再預約。
  /api/bookings/{bookingId}:
    put:
      tags: [預約]
      summary: 修改預約（撞期時附替代建議）
      operationId: updateBooking
      description: |
        對應 UI-01「看見同場地空檔建議」「看見當天已無空檔」「與其他規則並列時不顯示建議」「送出由建議帶入的時段」與 UI-02「看見其他可用場地」「看見此時段沒有其他可用場地」「與其他規則並列時不顯示建議」「送出由建議帶入的場地」在修改模式下對內層的需要，也是 001 UI-03「修改預約」的同一個操作。修改預約使用 HTTP PUT（與既有實作 `router.put("/api/bookings/:bookingId")` 一致），以完整內容送出（場地、日期、起訖、主題、人數）；本功能不新增 PATCH。僅預約者本人可修改，管理員不得代為修改。

        前置檢查（不附建議）：預約不存在回 404；非本人回 403；已開始或已結束（started）、狀態不可修改（status）、週期性場次所屬整批仍待審核（series_pending）回 409。這些情形不計算建議。

        只改主題或人數（場地、日期、起訖皆未改）時，只更新預約內容，人數仍須不超過容納人數，不重新判定時段、不重新審核，也不會產生建議。

        改場地、日期或起訖時的流程（與建立預約的差別）：
        1. 重跑單位、長度、已過去、最遠可預約日、開放時段、人數檢查（週期性場次的新日期不得晚於同批最後一場，series_range，且不受最遠可預約日限制），不重算持有筆數、不受預約權限暫停影響。
        2. 在同一交易內先釋出這筆預約自己的原時段（刪除其 holder 為本預約的時段占用）再判定占用，因此原時段不算被占用（FR-005 前半，與 001 不把自己的時段算成衝突一致）；占用判定為唯讀檢查，與其他未通過的規則並列於 violations（FR-008、FR-017）。
        3. violations 非空時整個交易回滾，原預約的場地、時段、內容與狀態完全不變，不記為取消、不呼叫候補遞補掛勾。
        4. violations 為空才占用新時段、更新預約、通知預約者，並在原時段釋出後呼叫候補遞補掛勾；修改後的場地需要審核時狀態變為 pending，否則為 confirmed。

        狀態碼與 `suggestions` 出現條件同建立預約：violations 恰好只有 `occupied` 時回 409 並附 suggestions；其他規則並列時不附。修改模式的建議計算差異：
        - `slots`：計算候選時不把本預約自己的原時段視為被占用；若所選場地與原場地相同，原時段（原日期與起訖）本身不得列為建議，建議只列與原時段不同的時段（FR-005 後半）。場地已改為另一個場地時，沒有需要排除的原時段。
        - `venues`：同建立預約，排除請求中所選的場地；本預約的原時段已釋出，因此原場地若在所選區間可用且符合條件，也可能被列入。
        - 併發重算：寫入新時段時若因併發而主鍵衝突，回滾後同樣回 409 occupied，並在新的唯讀交易內重新計算建議；該交易讀取時段占用時須以 holder 排除本預約自己的時段，否則會把尚未釋出的原時段誤算成被占用。

        回應時間與隱私要求同建立預約（NFR-001、NFR-003）。
      x-inner-needs:
        data:
          - name: bookings
            access: write
            fields:
              [
                id,
                user_id,
                venue_id,
                start_at,
                end_at,
                subject,
                attendees,
                status,
                series_id,
                confirmed_at,
                reminder_sent_at,
              ]
          - name: booking_series
            access: read
            fields: [id, status, last_date]
          - name: venues
            access: read
            fields: [id, name, capacity, requires_approval, is_active]
          - name: venue_opening_hours
            access: read
            fields: [venue_id, weekday, open_minute, close_minute]
          - name: venue_reviewers
            access: read
            fields: [venue_id, user_id]
          - name: booking_slots
            access: read
            fields: [venue_id, slot_start_at, holder_type, holder_id]
          - name: booking_slots
            access: write
            fields: [venue_id, slot_start_at, holder_type, holder_id]
          - name: booking_events
            access: write
            fields:
              [
                booking_id,
                actor_user_id,
                actor_type,
                occurred_at,
                from_status,
                to_status,
                reason,
              ]
          - name: waitlist_entries
            access: write
            fields:
              [
                id,
                venue_id,
                start_at,
                end_at,
                status,
                offer_expires_at,
                created_at,
              ]
          - name: notifications
            access: write
            fields:
              [
                user_id,
                type,
                message,
                booking_id,
                waitlist_entry_id,
                created_at,
              ]
          - name: rules
            access: read
            fields: [rule_key, int_value]
        files: []
      parameters:
        - $ref: "#/components/parameters/bookingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingInput"
      responses:
        "200":
          description: 已修改，回傳新狀態（confirmed 或 pending）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          description: |
            未通過的規則（violations：time_unit、end_not_after_start、duration、past、advance、opening_hours、capacity，含週期性場次日期晚於同批最後一場 series_range）或欄位錯誤（fields）。若同時有時段被占用，也一併列在同一份 violations；本情形一律不附 suggestions，原預約維持不變
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: 非本人預約，或其他無權限情形；本文不含任何預約內容
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 預約或新場地不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: |
            新時段已被占用（occupied）、已開始或已結束（started）、狀態不可修改（status）、整批仍在審核（series_pending）、場地已停用（venue_inactive）。violations 只有 occupied 一項時附 suggestions，其餘情形不附；失敗時原預約維持原場地、原時段、原內容與原狀態
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                occupiedWithSuggestions:
                  summary: 修改後的時段被占用，附不含原時段的空檔建議
                  value:
                    message: 該時段已被占用。請改選其他時段，或登記候補。
                    violations:
                      - rule: occupied
                        message: 該時段已被占用。請改選其他時段，或登記候補。
                    suggestions:
                      slots:
                        before: null
                        after:
                          startAt: "2026-11-20T04:00:00.000Z"
                          endAt: "2026-11-20T05:00:00.000Z"
                      noSlotsToday: false
                      venues: []
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sid
      description: 登入後由伺服器設定的 HttpOnly 階段憑證
  responses:
    Unauthorized:
      description: 未登入或登入已逾時
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: 沒有權限、必須先改密碼（訊息「請先設定新密碼」），或請求來源不被允許
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  parameters:
    bookingId:
      name: bookingId
      in: path
      required: true
      schema:
        type: integer
  schemas:
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: 繁體中文，說明發生什麼與可以怎麼做，不含內部代碼或技術細節，也不透露占用時段者是誰、其預約主題或人數；訊息中的時間以台北時間（UTC+8）書寫
          examples:
            - 該時段已被占用。請改選其他時段，或登記候補。
            - 已達持有上限（最多 5 筆）。請先取消或等待既有預約結束後再預約。
            - 您的預約權限已暫停，將於 2026-11-12 08:00 解除。解除前仍可報到、取消與修改既有預約。
            - 人數超過容納人數（可容納 4 人）。請減少人數或改選其他場地。
            - 這個場地已停用，無法預約。請改為一般預約，選擇其他場地。
            - 這筆預約已開始或已結束，無法修改。
            - 找不到這筆預約。請重新整理後再試一次。
            - 你沒有權限使用這個功能。請洽管理員。
        fields:
          type: array
          description: 欄位層級的錯誤，供前端標示在欄位下方
          items:
            $ref: "#/components/schemas/FieldError"
        violations:
          type: array
          description: 預約相關操作未通過的規則清單，每項含規則代號與說明；同一次請求的全部未通過規則並列於此，包含 occupied
          items:
            $ref: "#/components/schemas/Violation"
        suggestions:
          $ref: "#/components/schemas/Suggestions"
    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          description: 對應請求欄位名稱，例如 subject、attendees
        message:
          type: string
    Violation:
      type: object
      required: [rule, message]
      properties:
        rule:
          type: string
          description: 規則代號；畫面依代號決定文案。400 類：time_unit、end_not_after_start、duration、past、advance、opening_hours、capacity、series_range；409 類：occupied、quota、suspended、venue_inactive、started、status、series_pending
          enum:
            - time_unit
            - duration
            - end_not_after_start
            - past
            - advance
            - opening_hours
            - capacity
            - series_range
            - occupied
            - quota
            - suspended
            - venue_inactive
            - started
            - status
            - series_pending
        message:
          type: string
          description: 繁體中文，說明未通過的原因與可以怎麼做；暫停類訊息含以台北時間書寫的解除時間
    Suggestions:
      type: object
      description: 替代建議。只在 violations 恰好只有 occupied 一項時出現；建議只是暫時產生的唯讀結果，不被保存，也不保留任何時段
      required: [slots, noSlotsToday, venues]
      properties:
        slots:
          $ref: "#/components/schemas/SlotSuggestions"
        noSlotsToday:
          type: boolean
          description: slots 的 before 與 after 都是 null 時為 true，前端據此顯示「當天已無空檔」；不跨日尋找
        venues:
          type: array
          description: 同時段其他可用場地，已排好序（不需審核者在前、需審核者在後，各自依場地名稱排序），最多 5 個，沒有時為空陣列。再預約模式的前端不渲染此欄位
          maxItems: 5
          items:
            $ref: "#/components/schemas/VenueSuggestion"
    SlotSuggestions:
      type: object
      description: 同場地空檔建議；同一台北日期、長度與所選相同
      required: [before, after]
      properties:
        before:
          oneOf:
            - $ref: "#/components/schemas/SlotSuggestion"
            - type: "null"
          description: 開始時間早於所選、離所選開始時間最近的空檔；沒有時為 null
        after:
          oneOf:
            - $ref: "#/components/schemas/SlotSuggestion"
            - type: "null"
          description: 開始時間晚於所選、離所選開始時間最近的空檔；沒有時為 null
    SlotSuggestion:
      type: object
      description: 一個空檔建議；已通過一般單次預約的全部規則檢查（顯示當下），修改預約時不包含該筆預約自己的原時段
      required: [startAt, endAt]
      properties:
        startAt:
          type: string
          format: date-time
          pattern: "Z$"
          description: 空檔開始時間（UTC，帶 Z）；前端換算為台北日期與時分後顯示並填回表單
        endAt:
          type: string
          format: date-time
          pattern: "Z$"
          description: 空檔結束時間（UTC，帶 Z）；當天結束的 24:00 對應台北隔日 00:00
    VenueSuggestion:
      type: object
      description: 一個其他可用場地建議；只含場地公開欄位，不含任何占用者資訊
      required: [venueId, name, capacity, requiresApproval]
      properties:
        venueId:
          type: integer
        name:
          type: string
          description: 場地名稱
        capacity:
          type: integer
          description: 場地容納人數，不小於預約人數
        requiresApproval:
          type: boolean
          description: 場地是否需審核；true 時前端標示「需審核」，送出後預約為 pending
    TimeOfDay:
      type: string
      pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
      description: 台北當地時間 HH:mm
    EndTimeOfDay:
      type: string
      pattern: "^(([01][0-9]|2[0-3]):[0-5][0-9]|24:00)$"
      description: 台北當地時間 HH:mm，24:00 表示當日結束
    BookingStatus:
      type: string
      enum:
        [
          pending,
          confirmed,
          checked_in,
          completed,
          rejected,
          cancelled,
          no_show,
        ]
      description: 待審核、已確認、已報到、已完成、已駁回、已取消、未到場
    BookingInput:
      type: object
      description: 建立或修改單次預約的請求；date、startTime、endTime 為台北當地日期與時分，不接受帶時區或偏移量的時間戳。點選替代建議後，前端只是把建議換算成台北當地日期與時分（或場地識別）填回表單再送出，請求格式不變
      required: [venueId, date, startTime, endTime, subject, attendees]
      properties:
        venueId:
          type: integer
        date:
          type: string
          format: date
        startTime:
          $ref: "#/components/schemas/TimeOfDay"
        endTime:
          $ref: "#/components/schemas/EndTimeOfDay"
        subject:
          type: string
          maxLength: 100
        attendees:
          type: integer
          minimum: 1
    Booking:
      type: object
      required:
        [
          id,
          venueId,
          venueName,
          date,
          startTime,
          endTime,
          startAt,
          endAt,
          subject,
          attendees,
          status,
          lateCancel,
        ]
      properties:
        id:
          type: integer
        venueId:
          type: integer
        venueName:
          type: string
        date:
          type: string
          format: date
          description: 台北當地日期
        startTime:
          $ref: "#/components/schemas/TimeOfDay"
        endTime:
          $ref: "#/components/schemas/EndTimeOfDay"
        startAt:
          type: string
          format: date-time
          pattern: "Z$"
          description: 開始時間（UTC，帶 Z）
        endAt:
          type: string
          format: date-time
          pattern: "Z$"
          description: 結束時間（UTC，帶 Z）
        subject:
          type: string
        attendees:
          type: integer
        status:
          $ref: "#/components/schemas/BookingStatus"
        lateCancel:
          type: boolean
